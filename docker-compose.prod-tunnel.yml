# **طبقةُ الخادم — تُضاف فوق `docker-compose.yml`** ولا تحلّ محلَّه:
#
#   docker compose --env-file .env -f docker-compose.yml -f docker-compose.prod-tunnel.yml up -d
#
# **وهي غيرُ `docker-compose.tunnel.yml`**: ذاك نفقُ جهاز المالك بنطاقات
# الإنتاج، وهذا نفقُ الخادم بنطاقاتٍ تجريبية. **وخلطُهما يجعل نفقين بمُعرِّفٍ
# واحدٍ يتقاسمان الطلبات.**

services:
  # **العلّةُ التي أنشأت هذا الملف** (قِيس 2026-08-20): الخلفيةُ كانت تعمل بلا
  # `CORS_ORIGINS`، فتقع على افتراض الكود — **ثمانيةُ عناوينَ محلّية**. فأولُ
  # متصفحٍ على `stg-app` يخاطب `stg-api` **يُردّ**، ويقف على «الشبكة ضعيفة»
  # بينما `curl` يجيب ٢٠٠. وهو الفخُّ نفسُه الذي وقع محلياً مرتين في يومٍ واحد.
  backend:
    environment:
      # **الأسماءُ العاريةُ والقديمةُ معاً — والجمعُ مقصود** (قلبُ النطاقات،
      # قرارُ المالك 2026-08-25). الخادمُ يصير الاسمَ العاريَ لأن **ما لا
      # يُطفأ حين يُطفأ حاسوبُ المالك هو الذي يستحقّ اسمَه الحقيقيّ**؛
      # و`stg-*` تبقى **حتى لا تكون لحظةٌ لا يعمل فيها شيء**: سجلُّ DNS
      # يُحوَّل آخِراً، وحتى يُحوَّل يبقى `stg-*` هو الطريقَ إلى الخادم.
      #
      # **وحذفُها بعد استقرار القلب فعلٌ ثانٍ في يومٍ آخر** — لا معه.
      CORS_ORIGINS: >-
        ["https://app.tajora.ly","https://driver.tajora.ly","https://admin.tajora.ly",
         "https://stg-app.tajora.ly","https://stg-driver.tajora.ly","https://stg-admin.tajora.ly"]
      # **وهذه الثلاثةُ تُكتب بالاسم الهدف لا بالقديم**: قيمةٌ واحدةٌ لا تحتمل
      # اسمين، والهدفُ هو ما يصير صحيحاً لحظةَ تحويل السجلّ. **وثمنُ النافذة
      # بينهما مقيسٌ لا مقدَّر**: على قاعدة الخادم اليومَ `rides=0` و
      # `payments=0` — فلا عودةَ بطاقةٍ ولا صفحةَ مزوّدٍ تنتظر أحداً.
      PUBLIC_API_BASE_URL: https://api.tajora.ly
      CARD_RETURN_URL: https://app.tajora.ly/payments/card/return
      CARD_RETURN_URL_DRIVER: https://driver.tajora.ly/payments/card/return
    # **بلا `--reload` على الإنتاج** (قرارُ المالك 2026-09-22) — والتطويرُ يُبقيه
    # لأن الملفَّ الأساسيَّ لم يُمسّ. **الأمرُ نفسُه حرفاً ناقصاً `--reload`**:
    # `alembic upgrade head` باقٍ، والمنفذُ والمضيفُ كما هما، ولا عمّال.
    #
    # **ولمَ يضرّ هناك**: `./backend` مربوطٌ على `/app` قراءةً وكتابة، **فكلُّ
    # `git pull` يغيّر الشيفرةَ تحت العملية الحيّة** — و`--reload` يعيد تحميلَها
    # فوراً، **قبل** أن تُشغَّل الترحيلةُ وقبل أن تُعاد الحاوية. فيخدم الإنتاجُ
    # لحظاتٍ شيفرةً جديدةً على قاعدةٍ قديمة. وبدونه لا تتغيّر الشيفرةُ الحيّةُ إلا
    # حين يعيد `deploy.sh` الحاويةَ بعد الترحيلة.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # **البناءُ المحزَّم يخدمه `nginx`، لا خادمُ التطوير** (2026-08-21).
  #
  # **والعلّةُ مقيسةٌ على النفق منذ 2026-08-14**: خادمُ Vite يرسل الوحداتِ
  # مفرَّقةً — **٦٧ طلباً لشاشةٍ واحدة**، وكلُّ واحدٍ رحلةٌ عبر Cloudflare —
  # فتكتمل في ٥٫٥٩ ثانية. والبناءُ يجمعها في ملفاتٍ معدودة.
  #
  # **و`dist` يُبنى هنا ويُنقل**: §25.4 تفترض بناءً على الخادم، **ولا `node`
  # عليه** (قِيس 2026-08-20). فالبناءُ على الجهاز بهدفٍ مُصرَّحٍ به
  # (`check:target` يرفض غيرَه)، والنقلُ بعده.
  #
  # **ورؤوسُ التخزين نفسُها التي للصفحة**: الحافةُ خدمت نسخةَ أمس مرةً، وحزمةٌ
  # مخزَّنةٌ على الحافة تعني تطبيقاً قديماً في يد إنسان (العمودُ الخامس).
  # **ولوحةُ الإدارة معها منذ 2026-08-21** (قرارُ المالك): كانت محليةً وحدَها،
  # وحمايتُها **نفقَ SSH**. ونشرُها ينقل الحمايةَ من الشبكة إلى **الحساب** —
  # فلا يُقرأ هذا توسيعَ خدمةٍ بل تغييرَ نموذجِ تهديد: من كان يحتاج مفتاحَ خادمٍ
  # صار يحتاج كلمةَ مرورٍ وعاملاً ثانياً. ولذلك شُحن معها تفعيلُ TOTP من داخلها
  # وسطرُ التذكير الدائم.
  admin-panel:
    image: nginx:1.27-alpine
    container_name: taxo-admin-panel
    restart: unless-stopped
    command: ["nginx", "-g", "daemon off;"]
    volumes:
      - ./admin-panel/dist:/usr/share/nginx/html:ro
      - ./landing/spa.conf:/etc/nginx/conf.d/default.conf:ro
    ports: !reset []
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  customer-app:
    image: nginx:1.27-alpine
    container_name: taxo-customer-app
    restart: unless-stopped
    command: ["nginx", "-g", "daemon off;"]
    volumes:
      - ./customer-app/dist:/usr/share/nginx/html:ro
      - ./landing/spa.conf:/etc/nginx/conf.d/default.conf:ro
    ports: !reset []
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  driver-app:
    image: nginx:1.27-alpine
    container_name: taxo-driver-app
    restart: unless-stopped
    command: ["nginx", "-g", "daemon off;"]
    volumes:
      - ./driver-app/dist:/usr/share/nginx/html:ro
      - ./landing/spa.conf:/etc/nginx/conf.d/default.conf:ro
    ports: !reset []
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # **الصفحةُ التعريفية — nginx ساكنٌ بلا بناءٍ ولا `node`** (2026-08-21).
  #
  # **وخدمةٌ مستقلةٌ لا مجلدٌ داخل تطبيق**: الصفحةُ **قراءةٌ محضةٌ بلا جلسة**،
  # وتخدم ملفَّ APK بأحدَ عشرَ ميجابايت — وذاك عملُ خادمٍ ساكنٍ لا خادمِ تطوير.
  # **والأهمّ**: `customer-app/public/taxo-rider.apk` كان يُخدَم من
  # `app.tajora.ly` وهو بناءُ ١٤ آب بينما آخرُ بناءٍ ١٩ آب — **مصدرٌ ثانٍ
  # للملفّ نفسِه**، وقد أُزيل. فالمصدرُ الآن **هنا وحدَه**.
  landing:
    image: nginx:1.27-alpine
    container_name: taxo-landing
    restart: unless-stopped
    volumes:
      - ./landing:/usr/share/nginx/html:ro
      # **رؤوسُ التخزين عند الأصل** — وبغيرها تخدم الحافةُ نسخةً عمرُها أربعُ
      # ساعاتٍ بعد كل نشرة (قِيس 2026-08-21)
      - ./landing/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # **لا `ports`**: يصلها النفقُ عبر شبكة compose، ولا منفذَ يُفتح على العالم
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:2026.8.2@sha256:0aa26e284f05e6c77ae375b8c9c11d9eb6a448fb7bcd8d40f31cb6176189eb38
    container_name: taxo-prod-tunnel
    restart: unless-stopped
    # **يعمل بمستخدم مالك السرّ لا بمستخدم الصورة** (قِيس 2026-08-20): الصورةُ
    # تعمل بـ65532، واعتمادُ النفق `600` يملكه `taxo` (1001) في مجلدٍ `700`
    # (§25.1). فالمركَّبُ **موجودٌ ولا يُرى**، والحاويةُ تدور في حلقةِ
    # «credentials file doesn't exist» — **وهو الفخُّ نفسُه المكتوب في
    # `config.docker.yml` منذ 2026-08-14**، بوجهه الثاني.
    #
    # **والعلاجُ المستخدمُ لا الصلاحيات**: توسيعُ `600` على اعتمادِ نفقٍ يمنح
    # حاملَه توجيهَ `api.tajora.ly` إلى خادمه (§25.3) — فيُحلّ بمن يقرأ لا
    # بفتح ما يُقرأ.
    user: "1001:1001"
    command: tunnel --config /etc/cloudflared/config.prod.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
      - /home/taxo/secrets/cloudflared:/creds:ro
