# coturn — مُرحِّلُ مكالمة الرحلة (TURN) على خادمنا (SPEC §66-ج/15، §66-د/2). **لا مزوّدٌ مدفوع، ولا STUN/TURN لغيرنا.**
#
# **ولا سرَّ في هذا الملف**: `static-auth-secret` يُمرَّر من بيئة الخادم في `docker-compose.coturn.yml`
# (`TURN_SHARED_SECRET` — السرُّ نفسُه الذي تُصدر به الخلفيةُ بياناتِ الدخول المؤقّتة: `services/ride_calls.ice_servers`).
#
# ── المنافذ — **أضيقُ ما يكفي، وفتحُها في جدار الخادم قرارُ المالك** ─────────────────────────────────────────────
#
#   3478/udp           TURN/STUN — المسارُ الأوّل
#   3478/tcp           TURN على TCP — لشبكاتٍ تحجب UDP (شبكاتُ الشركات وبعضُ المقاهي)
#   49160-49200/udp    مدى الترحيل — منفذٌ لكلِّ تخصيص؛ والمكالمةُ المرحَّلةُ تأخذ تخصيصاً أو اثنين، فواحدٌ وأربعون منفذاً
#                      تتّسع لنحو عشرين مكالمةٍ مرحَّلةٍ معاً (وأغلبُ المكالمات لا تمرّ بالمُرحِّل أصلاً)
#
# **ولا يُفتح 5349 (TLS)**: لا شهادةَ هنا، والمستمعُ مطفأٌ بالسطرين `no-tls`/`no-dtls`. ويُفتح يومَ تُضاف شهادةٌ ويُقرَّر.

listening-port=3478
min-port=49160
max-port=49200

# **بياناتُ دخولٍ مؤقّتة** (TURN REST API): اسمٌ «انتهاء:معرّف» وكلمةٌ `base64(hmac_sha1(السرّ، الاسم))` — ساعتان، أطولُ من
# أطول مكالمة: التجديدُ أثناءها يحمل الختمَ نفسَه، **فختمٌ ينقضي في منتصفها يُسقطها** (`TURN_CREDENTIAL_TTL_SECONDS`، `core/config.py`).
# **لطرفَي الرحلة وحدهما وفي نافذتها** (تصدرها الخلفية). فلا يستعمل أحدٌ مُرحِّلَنا لغير مكالمة رحلة.
use-auth-secret
realm=taxo

fingerprint
no-cli
no-tls
no-dtls
no-tlsv1
no-tlsv1_1
stale-nonce=600

# **حدودٌ للإساءة**: تخصيصاتٌ قليلةٌ لكلِّ اسمٍ مؤقّت، وسقفٌ عامٌّ يحمي مدى المنافذ
user-quota=4
total-quota=100
no-multicast-peers

# **لا ترحيلَ إلى شبكةٍ خاصّة** — وإلا صار المُرحِّلُ باباً إلى الحاويات وقاعدتها من الإنترنت (SSRF)
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

log-file=stdout
simple-log
