<path d="M 40.5 8 Q 50 4 59.5 8 L 69.5 26 L 69.5 74 L 64.5 92 Q 50 96 35.5 92 L 30.5 74 L 30.5 26 Z" fill="#000000" opacity="0.22" transform="translate(2.5,3)"/>
<!-- **هالةٌ ثم حرفٌ داكن** — لا حرفٌ واحد: علامةٌ داكنةُ الهيكل بحرفٍ داكن
     **تختفي على خريطةٍ داكنة**، وفاتحةٌ بحرفٍ فاتحٍ تختفي على فاتحة. والهالةُ
     الفاتحةُ تحت الحرفِ الداكن تُقرأ على السمتين معاً — وهي ما تفعله تسمياتُ
     الخرائط نفسُها. **ولا تتبع سمةَ التطبيق**: الخريطةُ ليست CSS. -->
<path d="M 40.5 8 Q 50 4 59.5 8 L 69.5 26 L 69.5 74 L 64.5 92 Q 50 96 35.5 92 L 30.5 74 L 30.5 26 Z" fill="none" stroke="#f2f0eb" stroke-width="7" stroke-linejoin="round" opacity="0.62"/>
