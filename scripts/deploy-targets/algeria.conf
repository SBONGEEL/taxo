# **هدفُ رفع نسخة الجزائر** (SPEC §٧٣-هـ المرحلة ٦) — يقرؤه `scripts/deploy.sh` حين `TAXO_DEPLOY_TARGET=algeria`، و`pull-backup.ps1 -Target algeria`.
#
# **ولا سرَّ هنا** — عنوانُ خادمٍ ونطاقاتٌ ومسار. **و`CHANGE_ME` يُسقط الرفعَ بنصٍّ** حتى يُكتب عنوانُ الخادم الحقيقيّ
# (HANDOFF، «دليلُ نسخة الجزائر»). والأردنُ لا يقرأ هذا الملفَّ أبداً: قيمُه في `deploy.sh` كما كانت حرفاً.
TAXO_DEPLOY_HOST=CHANGE_ME
TAXO_REMOTE_PROJECT=~/taxo
TAXO_COMPOSE_FILES=-f docker-compose.yml -f docker-compose.prod-tunnel.yml -f docker-compose.algeria.yml
TAXO_FRONT_API_BASE=https://dz-api.tajora.ly
TAXO_HEALTH_URL=https://dz-api.tajora.ly/health
TAXO_SITE_URL=https://dz.tajora.ly
TAXO_BACKUP_DEST=/mnt/d/taxo-backups-dz
