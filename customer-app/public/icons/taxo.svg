<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="TAXO Rider">
  <!-- **الكلمةُ هي الأيقونة** (قرارُ المالك 2026-08-14).
       وما أفسد النسخةَ الأولى ليس أنها كلمة، بل **وزنُها**: حروفٌ بسماكة 8 على
       مربّع 512 (أي أقلَّ من بكسلٍ واحد عند 48px) وتسميةٌ بمقاس 38 تحتها.
       فهنا: سماكةٌ 40 — خمسةُ أضعاف — والكلمةُ تملأ عرضَ المربّع.

       **والتمييزُ على مستويين لا واحد**، لأن أيَّ كلمةٍ من خمسة أحرف لا تُقرأ
       عند 48px مهما كُبِّرت:
       ١. **قلبُ اللون** — الراكبُ داكنٌ بحروفٍ فاتحة، والكبتنُ عكسُه. يُميَّز
          من مسافةٍ بلا قراءة، وفي قائمةِ تطبيقاتٍ كلُّها داكنة.
       ٢. **الشريطُ السفلي** بالكلمة — يُقرأ عند 96px فما فوق، ويؤكّد ما قاله
          اللونُ عند المقاسات الصغيرة.
       ولا لونَ ثالث: اللوحةُ في §1.1 لونان، والورديُّ محجوزٌ للسِمة النسائية. -->
  <rect width="512" height="512" rx="114" fill="#14181d"/>

  <g fill="none" stroke="#e6edf3" stroke-width="36" stroke-linecap="round" stroke-linejoin="round">
    <!-- **الأربعةُ بارتفاعٍ واحد** (120) وسماكةٍ واحدة (36): كان `O` قطرُه 116
         وإخوتُه 132، فيُقرأ حرفاً صغيراً معلّقاً لا رابعاً في الكلمة. والقطرُ
         الخارجي هنا = ارتفاعُ الحرف بالضبط. -->
    <path d="M52 176 H132"/>
    <path d="M92 176 V296"/>
    <path d="M152 296 L189 176 L226 296"/>
    <path d="M166 258 H212"/>
    <path d="M246 176 L320 296"/>
    <path d="M320 176 L246 296"/>
    <circle cx="400" cy="236" r="42"/>
  </g>

  <rect x="146" y="344" width="220" height="70" rx="35" fill="#e6edf3"/>
  <text x="256" y="393" text-anchor="middle" fill="#14181d"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="40" font-weight="700" letter-spacing="6">RIDER</text>
</svg>
