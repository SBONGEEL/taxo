<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="TAXO">
  <!-- **علامةٌ لا كلمة** (2026-08-14، بعد رؤيتها على شاشةٍ حقيقية).
       كانت الأيقونة كلمةَ `TAXO` بحروفٍ رفيعةٍ (stroke 11) وتحتها `RIDER`
       بمقاس 38 — أي **نصٌّ داخل مربّعٍ 48px** على الشاشة الرئيسية. فتُقرأ
       لطخةً رمادية، ولا تُميَّز عن أيقونة الكبتن إلا بتدقيق.

       والعلامةُ الجديدة **حرفُ O من الاسم نفسِه** — وهو مِلكُ هذه العلامة
       أصلاً: الشاشةُ الترحيبية تُبقيه وحدَه دائراً مؤشِّرَ تحميل (`DESIGN.md`
       §7). فما يعرفه المستخدمُ من الإقلاع يجده على شاشته الرئيسية.

       والوزنُ هو الفرق: حلقةٌ بسماكة 46 على قطر 300 تُقرأ من نصف متر.
       ولا نصَّ إطلاقاً — اسمُ التطبيق تحت الأيقونة يكتبه النظامُ بخطّه.

       ألوانُ §1.1 ليليةً ثابتة: أيقونةُ النظام لا تتبع سِمةَ التطبيق. -->
  <rect width="512" height="512" rx="114" fill="#14181d"/>

  <!-- الحلقةُ مفتوحةٌ قليلاً في أعلاها كما تنفتح في الترحيبية قبل دورانها -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#e6edf3" stroke-width="46"
          stroke-linecap="round" stroke-dasharray="800 143" transform="rotate(-64 256 256)"/>

  <!-- **نقطةُ الراكب**: مركزٌ ممتلئ — الحلقةُ والنقطةُ معاً تُقرأ «موقعاً»،
       وهي ما يفعله هذا التطبيق: يحدّد نقطةً ويطلب إليها سيارة. -->
  <circle cx="256" cy="256" r="52" fill="#e6edf3"/>
</svg>
