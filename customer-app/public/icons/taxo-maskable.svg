<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="TAXO">
  <!-- **القابلةُ للقصّ**: الخلفيةُ تملأ المربّعَ كلَّه بلا زوايا مستديرة (يقصّها
       المشغِّل بشكله)، والعلامةُ مصغَّرةٌ إلى ٪٧٦ حول المركز — فتبقى كاملةً
       داخل الدائرة مهما كان شكلُ القناع. مولَّدةٌ من `taxo.svg` نفسِه فلا
       تفترق نسختان. -->
  <rect width="512" height="512" fill="#14181d"/>
  <g transform="translate(256 256) scale(0.76) translate(-256 -256)">

  <!-- الحلقةُ مفتوحةٌ قليلاً في أعلاها كما تنفتح في الترحيبية قبل دورانها -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#e6edf3" stroke-width="46"
          stroke-linecap="round" stroke-dasharray="800 143" transform="rotate(-64 256 256)"/>

  <!-- **نقطةُ الراكب**: مركزٌ ممتلئ — الحلقةُ والنقطةُ معاً تُقرأ «موقعاً»،
       وهي ما يفعله هذا التطبيق: يحدّد نقطةً ويطلب إليها سيارة. -->
  <circle cx="256" cy="256" r="52" fill="#e6edf3"/>
  </g>
</svg>
