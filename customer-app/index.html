<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` مع الحشوات الآمنة في `index.css`: الخريطة ملء
         الشاشة، فبدونه يختفي شريط الأزرار خلف شريط الهاتف السفلي -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="TAXO — اطلب تاكسي في دقائق" />
    <meta name="theme-color" content="#f4f1ea" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/taxo.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- **خطّا TAXO 2.0** (Claude Design «Identity»): Readex Pro للنصّ، وUnbounded
         للشعار والأرقام. بالطريق نفسِه الذي يُحمَّل به خطُّ التطبيق القائم -->
    <link
      href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300..700&family=Unbounded:wght@500..800&display=swap"
      rel="stylesheet"
    />
    <!-- **أيقوناتُ TAXO 2.0** (Material Symbols Rounded كما في اللوحة) — **مقتطعةً بأسمائها**
         لا الخطَّ كاملاً، وبترتيبها الأبجديّ كما يشترط المُقدِّم. ومن أضاف أيقونةً في
         `screens/t2` أضاف اسمَها هنا، وإلا ظهر اسمُها نصّاً. و`block` لا `swap`: نصُّ الاسم
         لا يُرى لحظةَ التحميل -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&icon_names=account_balance,account_balance_wallet,add,add_card,arrow_back,arrow_downward,arrow_forward,arrow_upward,auto_awesome,bedtime,bolt,bookmark,bug_report,calendar_clock,calendar_today,campaign,check,check_circle,chevron_left,close,content_copy,credit_card,dark_mode,delete,description,directions_bus,directions_car,edit,error,event,event_busy,event_upcoming,expand_more,favorite,fingerprint,flight_takeoff,gavel,grid_view,group,headset_mic,help,home,hourglass_top,how_to_reg,inventory_2,ios_share,light_mode,local_fire_department,local_shipping,local_taxi,location_on,lock,mail,map,my_location,navigation,notifications,open_in_full,open_in_new,package_2,payments,pedal_bike,percent,person,photo_camera,radio_button_unchecked,receipt_long,redeem,refresh,route,schedule,search,sell,settings,share_location,shield,shopping_bag,shopping_cart,smartphone,star,storefront,support,sync_alt,timer,toll,trophy,verified,verified_user,visibility,visibility_off,volume_up,woman,work&display=block"
      rel="stylesheet"
    />

    <title>TAXO</title>

    <!-- **السِمة قبل أول إطار** (`DESIGN.md` §7.6): `index.css` وReact كلاهما
         في الحزمة المؤجَّلة، فبغير هذا السطر تُرسم الشاشةُ الترحيبية نهاريةً ثم
         تنقلب ليليةً — ومضةٌ في كل فتحة لمن اختار الليلي. ويقرأ نفس مفتاحَي
         `lib/theme.ts` و`lib/brand.tsx` حرفاً بحرف -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var theme = localStorage.getItem("taxo.theme") || "system";
          var dark =
            theme === "dark" ||
            (theme === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) root.classList.add("dark");
          // **مقياسُ مسرح الترحيب** — الإطارُ ٣٩٠×٨٤٤ يُغطّي الشاشة كما يُغطّيها الترحيبُ نفسُه (`useStageScale`)
          root.style.setProperty("--boot-scale", String(Math.max(innerWidth / 390, innerHeight / 844)));
          // **آخرُ قيمةٍ محسوبة** لا الاختيارُ الخام: السِمةُ تشترط إقرارَ
          // الجنس، وهو في الجلسة التي لم تصل بعد — فاختيارٌ باقٍ في جهازٍ
          // بدّل صاحبَه كان سيصبغ شعارَ من لا تُتاح له
          if (localStorage.getItem("taxo.pink.active") === "1")
            root.classList.add("pink");
          // **تكوّنُ الـX للعائد يبدأ من أوّل رسم** (بلاغُ المالك ٢٠٢٦-١٠-٠٦، `#boot .bt-logo` أدناه): العائدُ من رأى المقدّمةَ أو بقيت
          // جلستُه — **والمقدّمةُ الأولى لا تبدأ هنا** (غطاؤها كاملٌ حتى تُركَّب). و«تقليلُ الحركة» الحقيقيُّ يعرض الإطارَ الأخير وحدَه.
          // **والترحيبُ يكمل من حيث وصلت** (`__taxoBoot.start` — `Welcome.tsx`)
          var returning = localStorage.getItem("taxo.welcome.seen") === "1" || !!localStorage.getItem("taxo.access_token");
          var reduce = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
          window.__taxoBoot = { start: performance.now(), brief: returning, reduced: reduce };
          root.classList.add(returning ? (reduce ? "bt-final" : "bt-brief") : "bt-first");
        } catch (e) {
          /* تخزينٌ محجوب: تبقى الافتراضاتُ كما هي — ولا تُمنع الشاشة */
        }
      })();
    </script>

    <!-- **إطارُ الإقلاع = أوّلُ إطارٍ من الترحيب** (§٦٢/١ و/١٠): كانت هنا «الترحيبيةُ» القديمة (رسمُ TAXO وحلقتُه الدوّارة) تُرى
         قبل ترحيب TAXO 2.0 في كلِّ فتحة — **فرأى المالكُ الترحيبَ القديم**. وصار هنا ما يرسمه الترحيبُ في لحظته الأولى بعينه:
         خريطةُ عمّان تحت غطائها، **بمظهر الجهاز من أوّل رسم** (`html.dark` من السطر أعلاه)، والمسرحُ بالقياس نفسِه
         (`--boot-scale`) — **فيحلّ الترحيبُ محلَّه حين يُركَّب بلا قفزة** (`lib/splash.ts` → `removeBootFrame`). والقيمُ نسخةٌ
         حرفيّةٌ من `welcome.css` و`taxo2/tokens.css` لأنهما في الحزمة المؤجَّلة — وهي الحالُ الوحيدةُ المسموحُ فيها بالنسخ. -->
    <style>
      #boot { position: fixed; inset: 0; z-index: 100; overflow: hidden; background: #f4f1ea; }
      html.dark #boot { background: #0e1013; }
      #boot .bt-stage {
        position: absolute; left: 50%; top: 50%; width: 390px; height: 844px;
        transform: translate(-50%, -50%) scale(var(--boot-scale, 1)); transform-origin: 50% 50%;
      }
      #boot .bt-cam {
        position: absolute; left: 0; top: 0; width: 390px; height: 844px;
        transform-origin: 0 0; transform: translate(-382.78px, -1053.42px) scale(3);
      }
      #boot .bt-cam img { display: block; width: 390px; height: 844px; max-width: none; }
      #boot .bt-night, html.dark #boot .bt-day { display: none; }
      html.dark #boot .bt-night { display: block; }
      #boot .bt-veil { position: absolute; inset: 0; background: #f4f1ea; opacity: 0.82; }
      html.dark #boot .bt-veil { background: #0e1013; }
      /* **الشعارُ وتكوّنُ الـX للعائد — من أوّل رسم** (بلاغُ المالك ٢٠٢٦-١٠-٠٦): كان الترحيبُ ينتظر الحزمة (نحو ثانيتين عبر الشبكة على
         S21) فتُرى شاشةٌ شبهُ سوداء ثمّ X صغيرةٌ تمضي — «لا شيءَ يتحرّك». **فالـ٠٫٨ث المرسومةُ في اللوحة («من المرة الثانية: لحظةُ تكوّن
         X فقط») تبدأ هنا**، والترحيبُ يكمل من حيث وصلت. القيمُ نسخةٌ من `welcome.css` (المواضعُ والألوان) — **والمقدّمةُ الأولى لا تبدأ
         هنا**: غطاؤها كاملٌ حتى تُركَّب. */
      #boot .bt-logo { display: none; position: absolute; inset: 0; }
      html.bt-brief #boot .bt-logo, html.bt-final #boot .bt-logo { display: block; }
      html.bt-first #boot .bt-veil { opacity: 1; }
      #boot .bt-xmark { position: absolute; left: 217.1px; top: 360px; width: 0; height: 0; transform-origin: 0 0; opacity: 0; }
      #boot .bt-xmark > span { position: absolute; left: 0; top: 0; width: 26.67px; height: 6.02px; }
      #boot .bt-xmark > span:first-child { transform: translate(-50%, -50%) rotate(-50deg); }
      #boot .bt-xmark > span:last-child { transform: translate(-50%, -50%) rotate(50deg); }
      #boot .bt-xmark i { display: block; width: 100%; height: 100%; border-radius: 3.44px; transform: scaleX(0); background: #14161a; }
      #boot .bt-xmark > span:last-child i, #boot .bt-xb > span:last-child { background: #f05a28; }
      html.dark #boot .bt-xmark > span:first-child i, html.dark #boot .bt-xb > span:first-child { background: #f2efe8; }
      html.dark #boot .bt-xmark > span:last-child i, html.dark #boot .bt-xb > span:last-child { background: #ff6a33; }
      html.pink #boot .bt-xmark > span:last-child i, html.pink #boot .bt-xb > span:last-child { background: #9c2c6e; }
      html.pink.dark #boot .bt-xmark > span:last-child i, html.pink.dark #boot .bt-xb > span:last-child { background: #f08cc0; }
      #boot .bt-word {
        position: absolute; left: 0; right: 0; top: 360px; transform: translateY(-50%); text-align: center; opacity: 0;
        font-family: "Unbounded", "Readex Pro", sans-serif; font-weight: 800; font-size: 64px; line-height: 1; letter-spacing: -0.03em;
        white-space: nowrap; color: #14161a;
      }
      html.dark #boot .bt-word { color: #f2efe8; }
      #boot .bt-xb { position: relative; display: inline-block; width: 51.61px; height: 49.55px; margin: 0 4.13px; vertical-align: -1.03px; }
      #boot .bt-xb > span { position: absolute; left: 50%; top: 50%; width: 64px; height: 14.45px; border-radius: 8.26px; background: #14161a; }
      #boot .bt-xb > span:first-child { transform: translate(-50%, -50%) rotate(-50deg); }
      #boot .bt-xb > span:last-child { transform: translate(-50%, -50%) rotate(50deg); }
      html.bt-brief #boot .bt-xmark { animation: bt-x-s .8s var(--bt-delay, 0ms) both, bt-x-o .8s var(--bt-delay, 0ms) both; }
      html.bt-brief #boot .bt-xmark > span:first-child i { animation: bt-b1 .8s var(--bt-delay, 0ms) both; }
      html.bt-brief #boot .bt-xmark > span:last-child i { animation: bt-b2 .8s var(--bt-delay, 0ms) both; }
      html.bt-brief #boot .bt-word { animation: bt-w-o .8s var(--bt-delay, 0ms) both, bt-w-ls .8s var(--bt-delay, 0ms) both; }
      html.bt-final #boot .bt-word { opacity: 1; }
      /* الـ٠٫٨ث: القضيبان (٠←٠٫٣ · ٠٫١←٠٫٤) · الكِبَرُ إلى حجم الشعار (٠٫٣←٠٫٦) · الحروفُ تتجمّع والـX يذوب فيها (٠٫٤٥←٠٫٨) */
      @keyframes bt-b1 { 0% { transform: scaleX(0); animation-timing-function: cubic-bezier(.2,.8,.2,1); } 37.5%, 100% { transform: scaleX(1); } }
      @keyframes bt-b2 { 0%, 12.5% { transform: scaleX(0); animation-timing-function: cubic-bezier(.2,.8,.2,1); } 50%, 100% { transform: scaleX(1); } }
      @keyframes bt-x-s { 0%, 37.5% { transform: scale(1); animation-timing-function: cubic-bezier(.65,0,.35,1); } 75%, 100% { transform: scale(2.4); } }
      @keyframes bt-x-o { 0%, 68.75% { opacity: 1; animation-timing-function: cubic-bezier(.2,.8,.2,1); } 100% { opacity: 0; } }
      @keyframes bt-w-o { 0%, 56.25% { opacity: 0; animation-timing-function: cubic-bezier(.2,.8,.2,1); } 100% { opacity: 1; } }
      @keyframes bt-w-ls { 0%, 56.25% { letter-spacing: .14em; animation-timing-function: cubic-bezier(.2,.8,.2,1); } 100% { letter-spacing: -.03em; } }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <div class="bt-stage">
        <div class="bt-cam">
          <img class="bt-day" src="/welcome/amman-day.svg" alt="" />
          <img class="bt-night" src="/welcome/amman-night.svg" alt="" />
        </div>
        <div class="bt-veil"></div>
        <div class="bt-logo" aria-hidden="true">
          <div class="bt-xmark"><span><i></i></span><span><i></i></span></div>
          <div class="bt-word" dir="ltr">TA<span class="bt-xb"><span></span><span></span></span>O</div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
