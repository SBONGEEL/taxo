<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ light }}" hint-placeholder-val="{{ true }}">
<div dir="ltr" style="position:relative;height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 38px;color:#14161A;font:600 15px/1 'Readex Pro',system-ui,sans-serif">
<span>9:41</span>
<span style="position:absolute;left:50%;top:11px;transform:translateX(-50%);width:118px;height:33px;border-radius:20px;background:#08090A"></span>
<span style="display:flex;gap:6px;align-items:center"><span style="font:17px/1 'Material Symbols Rounded';font-variation-settings:'FILL' 1">signal_cellular_alt</span><span style="font:17px/1 'Material Symbols Rounded';font-variation-settings:'FILL' 1">wifi</span><span style="position:relative;width:24px;height:12px;border:1.5px solid #14161A;border-radius:4px;box-sizing:border-box;padding:1.5px"><span style="display:block;width:75%;height:100%;border-radius:1.5px;background:#14161A"></span></span></span>
</div>
</sc-if>
<sc-if value="{{ dark }}" hint-placeholder-val="{{ false }}">
<div dir="ltr" style="position:relative;height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 38px;color:#F2EFE8;font:600 15px/1 'Readex Pro',system-ui,sans-serif">
<span>9:41</span>
<span style="position:absolute;left:50%;top:11px;transform:translateX(-50%);width:118px;height:33px;border-radius:20px;background:#000000"></span>
<span style="display:flex;gap:6px;align-items:center"><span style="font:17px/1 'Material Symbols Rounded';font-variation-settings:'FILL' 1">signal_cellular_alt</span><span style="font:17px/1 'Material Symbols Rounded';font-variation-settings:'FILL' 1">wifi</span><span style="position:relative;width:24px;height:12px;border:1.5px solid #F2EFE8;border-radius:4px;box-sizing:border-box;padding:1.5px"><span style="display:block;width:75%;height:100%;border-radius:1.5px;background:#F2EFE8"></span></span></span>
</div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:50},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark;
    return { dark, light: !dark };
  }
}
</script>
</body>
</html>
