<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=Readex+Pro:wght@600;700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #0e1013; }
  .frame { position: relative; width: 1080px; height: 1080px; overflow: hidden;
    background: radial-gradient(circle at 50% 46%, #23262c 0%, #15171b 48%, #0b0c0f 100%); }
  .ring { position: absolute; left: 22px; top: 22px; width: 1036px; height: 1036px; border-radius: 50%;
    box-shadow: inset 0 0 0 10px #ff6a33; }
  .glow { position: absolute; left: 190px; top: 640px; width: 700px; height: 120px; border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(255,106,51,.38) 0%, rgba(255,106,51,0) 70%); filter: blur(6px); }
  .wm { position: absolute; top: 190px; left: 0; right: 0; text-align: center; direction: ltr;
    font-family: "Unbounded", sans-serif; font-weight: 800; color: #fff; font-size: 150px; line-height: 1; letter-spacing: 0; }
  .wm .x { display: inline-block; position: relative; vertical-align: -2px; }
  .wm .x span { position: absolute; left: 50%; top: 50%; }
  .label { position: absolute; top: 372px; left: 0; right: 0; text-align: center;
    font-family: "Readex Pro", sans-serif; font-weight: 700; font-size: 54px; color: #ff6a33; }
  .car { position: absolute; left: 175px; top: 420px; width: 730px; }
  .flag { position: absolute; left: 50%; transform: translateX(-50%); top: 800px; height: 128px;
    border-radius: 14px; box-shadow: 0 0 0 5px #fff, 0 10px 30px rgba(0,0,0,.55); display: block; }
</style>
</head>
<body>
<div class="frame" id="frame">
  <div class="ring"></div>
  <div class="glow"></div>
  <div class="wm" id="wm"></div>
  <div class="label" id="label"></div>
  <img class="car" src="../../customer-app/public/cars/comfort-34-night-640.webp" alt="">
  <div id="flagwrap"></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const cc = q.get("cc") || "JO";
  const k = 150 / 31;
  document.getElementById("wm").innerHTML =
    'TA<span class="x" style="width:' + 25 * k + 'px;height:' + 24 * k + 'px;margin:0 ' + 2 * k + 'px">' +
    '<span style="width:' + 31 * k + 'px;height:' + 7 * k + 'px;border-radius:' + 4 * k + 'px;background:#fff;transform:translate(-50%,-50%) rotate(-50deg)"></span>' +
    '<span style="width:' + 31 * k + 'px;height:' + 7 * k + 'px;border-radius:' + 4 * k + 'px;background:#ff6a33;transform:translate(-50%,-50%) rotate(50deg)"></span>' +
    '</span>O';
  document.getElementById("label").textContent = { JO: "كباتن الأردن", DZ: "كباتن الجزائر", LY: "كباتن ليبيا" }[cc];

  function star(cx, cy, n, ro, ri, rot) {
    const pts = [];
    for (let i = 0; i < 2 * n; i++) {
      const r = i % 2 ? ri : ro;
      const a = rot + (Math.PI * i) / n;
      pts.push((cx + r * Math.cos(a)).toFixed(2) + "," + (cy + r * Math.sin(a)).toFixed(2));
    }
    return pts.join(" ");
  }
  const up = -Math.PI / 2;
  const flags = {
    // الأردن ٢:١ — أسود · أبيض · أخضر، ومثلّثٌ أحمر عند السارية فيه نجمةٌ سباعيّةٌ بيضاء
    JO: '<svg class="flag" viewBox="0 0 1008 504" xmlns="http://www.w3.org/2000/svg">' +
        '<rect width="1008" height="168" fill="#000"/><rect y="168" width="1008" height="168" fill="#fff"/>' +
        '<rect y="336" width="1008" height="168" fill="#007a3d"/><polygon points="0,0 504,252 0,504" fill="#ce1126"/>' +
        '<polygon points="' + star(168, 252, 7, 42, 20, up) + '" fill="#fff"/></svg>',
    // الجزائر ٣:٢ — أخضرُ عند السارية وأبيض، وهلالٌ ونجمةٌ حمراوان في الوسط
    DZ: '<svg class="flag" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">' +
        '<defs><mask id="m"><rect width="900" height="600" fill="#fff"/><circle cx="487.5" cy="300" r="120" fill="#000"/></mask></defs>' +
        '<rect width="450" height="600" fill="#006233"/><rect x="450" width="450" height="600" fill="#fff"/>' +
        '<circle cx="450" cy="300" r="150" fill="#d21034" mask="url(#m)"/>' +
        '<polygon points="' + star(518, 300, 5, 76, 29, Math.PI) + '" fill="#d21034"/></svg>',
    // ليبيا ٢:١ — أحمر · أسود (ضعفٌ) · أخضر، وهلالٌ ونجمةٌ بيضاوان في الوسط
    LY: '<svg class="flag" viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">' +
        '<defs><mask id="m"><rect width="1000" height="500" fill="#fff"/><circle cx="497" cy="250" r="86" fill="#000"/></mask></defs>' +
        '<rect width="1000" height="125" fill="#e70013"/><rect y="125" width="1000" height="250" fill="#000"/>' +
        '<rect y="375" width="1000" height="125" fill="#239e46"/>' +
        '<circle cx="470" cy="250" r="105" fill="#fff" mask="url(#m)"/>' +
        '<polygon points="' + star(560, 250, 5, 48, 19, Math.PI) + '" fill="#fff"/></svg>',
  };
  document.getElementById("flagwrap").innerHTML = flags[cc];
</script>
</body>
</html>
