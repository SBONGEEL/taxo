<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>R16c ورقة الشحن</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300..700&amp;family=Unbounded:wght@500..800&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&amp;display=block">
<style>body{margin:0}</style>
</helmet>
<div dir="rtl" data-screen-label="R16c ورقة الشحن" style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background:#F4F1EA;font-family:'Readex Pro',system-ui,sans-serif;color:#14161A">
  <!-- المحفظة R11 تحت الورقة -->
  <div style="padding:56px 18px 0">
    <h2 style="margin:0 0 14px;font-size:26px;font-weight:700">المحفظة</h2>
    <div style="position:relative;overflow:hidden;background:#14161A;color:#F4F1EA;border-radius:26px;padding:20px">
      <span style="position:absolute;left:-30px;top:-10px;width:200px;height:34px;border-radius:17px;background:#F05A28;transform:rotate(45deg)"></span>
      <span style="position:absolute;left:-30px;top:-10px;width:200px;height:34px;border-radius:17px;background:#F4F1EA;opacity:.12;transform:rotate(-45deg)"></span>
      <div style="position:relative;font-size:13px;color:#B9BEC6">الرصيد</div>
      <div style="position:relative;display:flex;align-items:baseline;gap:6px;margin:4px 0 18px"><span dir="ltr" style="font-family:Unbounded;font-weight:700;font-size:42px;letter-spacing:-.03em;line-height:1.1">12.350</span><span style="font-size:15px;color:#B9BEC6">د.أ</span></div>
      <div style="position:relative;display:flex;gap:8px">
        <span style="flex:1;height:46px;border-radius:14px;background:#F05A28;color:#14161A;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14.5px;font-weight:700"><span style="font:20px/1 'Material Symbols Rounded'">add</span>شحن الرصيد</span>
        <span style="flex:1;height:46px;border-radius:14px;border:1px solid #3B3E45;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14.5px;font-weight:600;box-sizing:border-box"><span style="font:20px/1 'Material Symbols Rounded'">sync_alt</span>تحويل لصديق</span>
      </div>
    </div>
  </div>
  <!-- الظلُّ تحت الورقة -->
  <div style="position:absolute;inset:0;background:rgba(20,22,26,.45)"></div>

  <!-- الورقةُ: لغة R06 — حجرٌ بمقبض، وزاويةُ ٣٠ -->
  <div style="position:absolute;left:0;right:0;bottom:0;background:#F4F1EA;border-radius:30px 30px 0 0;padding:10px 18px 30px;box-shadow:0 -12px 40px rgba(20,22,26,.14)">
    <div style="width:40px;height:5px;border-radius:3px;background:#D2CBBE;margin:0 auto 14px"></div>
    <div style="font-size:19px;font-weight:700">شحن الرصيد</div>
    <div style="margin:2px 0 12px;font-size:13px;color:#6A6862">اختر المبلغ ثم طريقة الشحن.</div>

    <div style="background:#FFFFFF;border-radius:24px;padding:14px 16px">
      <div style="font-size:12.5px;color:#6A6862">المبلغ</div>
      <div style="display:flex;align-items:baseline;gap:6px;margin-top:2px">
        <span dir="ltr" style="flex:1;font-family:Unbounded;font-weight:700;font-size:40px;letter-spacing:-.03em;line-height:1.15;text-align:right">10</span>
        <span style="font-size:15px;font-weight:600">د.أ</span>
      </div>
      <div style="border-top:1.5px dashed #E0DAD0;margin:12px 0"></div>
      <div style="display:flex;gap:6px">
        <span style="flex:1;height:44px;border-radius:14px;border:1px solid #D2CBBE;display:flex;align-items:center;justify-content:center;font-size:13.5px;box-sizing:border-box">5.000 د.أ</span>
        <span style="flex:1;height:44px;border-radius:14px;border:2px solid #14161A;display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:700;box-sizing:border-box">10.000 د.أ</span>
        <span style="flex:1;height:44px;border-radius:14px;border:1px solid #D2CBBE;display:flex;align-items:center;justify-content:center;font-size:13.5px;box-sizing:border-box">20.000 د.أ</span>
      </div>
    </div>

    <!-- القناتان صفّان في قائمة — لغةُ منتقي الدفع: أيقونةٌ وعنوانٌ وسطرٌ يقول ما يقع بعد الضغط -->
    <div style="margin-top:12px;background:#FFFFFF;border-radius:22px;padding:0 14px">
      <div style="display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #F0ECE4">
        <span style="font:22px/1 'Material Symbols Rounded';color:#6A6862">credit_card</span>
        <div style="flex:1;min-width:0"><div style="font-size:14.5px;font-weight:700">بطاقة</div><div style="margin-top:3px;font-size:13px;line-height:1.55;color:#6A6862">شحن فوري عبر صفحة الدفع الآمنة</div></div>
        <span style="font:20px/1 'Material Symbols Rounded';color:#A8A398">chevron_left</span>
      </div>
      <div style="display:flex;align-items:center;gap:12px;padding:14px 0">
        <span style="font:22px/1 'Material Symbols Rounded';color:#6A6862">smartphone</span>
        <div style="flex:1;min-width:0"><div style="font-size:14.5px;font-weight:700">كليك</div><div style="margin-top:3px;font-size:13px;line-height:1.55;color:#6A6862">حوّل ثم يُضاف بعد التأكد</div></div>
        <span style="font:20px/1 'Material Symbols Rounded';color:#A8A398">chevron_left</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
