<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>R19 الدفع</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300..700&amp;family=Unbounded:wght@500..800&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&amp;display=block">
<style>body{margin:0}</style>
</helmet>
<!-- الدفعُ طبقةٌ كاملةٌ بلا شريط تبويب — بنيةُ R10: رأسٌ، وبطاقةُ الأجرة، والزرُّ في القاع -->
<div dir="rtl" data-screen-label="R19 الدفع" style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background:#F4F1EA;font-family:'Readex Pro',system-ui,sans-serif;color:#14161A;display:flex;flex-direction:column;padding:56px 22px 36px">
  <div style="display:flex;align-items:center;gap:12px">
    <span style="width:44px;height:44px;flex:none;border-radius:50%;background:#FFFFFF;border:1px solid #E0DAD0;display:flex;align-items:center;justify-content:center;box-sizing:border-box"><span style="font:22px/1 'Material Symbols Rounded'">arrow_forward</span></span>
    <h1 style="margin:0;font-size:22px;font-weight:700">الدفع</h1>
  </div>

  <!-- ما يُدفع الآن: المتبقّي لا الأجرة، والقناةُ في حبّة R10 -->
  <div style="margin-top:18px;background:#FFFFFF;border-radius:24px;padding:16px 18px">
    <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:10px">
      <div>
        <div style="font-size:12.5px;color:#6A6862">المتبقي على هذه الرحلة</div>
        <div style="display:flex;align-items:baseline;gap:6px"><span dir="ltr" style="font-family:Unbounded;font-weight:700;font-size:40px;letter-spacing:-.03em;line-height:1.15">3.876</span><span style="font-size:15px;font-weight:600">د.أ</span></div>
        <div style="font-size:12px;color:#6A6862">دينار أردني</div>
      </div>
      <span style="display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:99px;background:#F4F1EA;margin-bottom:6px;white-space:nowrap"><span style="font:16px/1 'Material Symbols Rounded'">account_balance_wallet</span>المحفظة</span>
    </div>
    <div style="border-top:1.5px dashed #E0DAD0;margin:12px 0 8px"></div>
    <div style="display:grid;grid-template-columns:1fr auto;gap:5px 0;font-size:13px"><span style="color:#6A6862">الأجرة النهائية</span><span style="font-weight:700">3.876 د.أ</span></div>
  </div>

  <div style="flex:1"></div>

  <!-- الالتزامُ بالجمر (الهوية: «طلب / قبول») — و«طريقة أخرى» مخرجٌ لا يجعل التفضيلَ قيداً (القرار 3) -->
  <div style="height:58px;border-radius:18px;background:#F05A28;color:#14161A;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700">ادفع من المحفظة</div>
  <div style="height:44px;margin-top:4px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#6A6862">طريقة أخرى</div>
  <p style="margin:2px 8px 0;text-align:center;font-size:12px;line-height:1.6;color:#6A6862">يُخصم المبلغ فوراً من رصيدك، وإيصالك في سجل الرحلات.</p>
  <span style="position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#14161A"></span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
