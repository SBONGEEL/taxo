<x-dc>
<helmet>

<div dir="rtl" data-screen-label="R19c الدفع بالبطاقة" style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background:#F4F1EA;font-family:'Readex Pro',system-ui,sans-serif;color:#14161A">
  <!-- R19 تحت الورقة، والبطاقةُ قناةٌ مختارة -->
  <div style="padding:56px 22px 0">
    <div style="display:flex;align-items:center;gap:12px">
      <span style="width:44px;height:44px;flex:none;border-radius:50%;background:#FFFFFF;border:1px solid #E0DAD0;display:flex;align-items:center;justify-content:center;box-sizing:border-box"><span style="font:22px/1 'Material Symbols Rounded'">arrow_forward</span></span>
      <h1 style="margin:0;font-size:22px;font-weight:700">الدفع</h1>
    </div>
    <div style="margin-top:18px;background:#FFFFFF;border-radius:24px;padding:16px 18px">
      <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:10px">
        <div><div style="font-size:12.5px;color:#6A6862">المتبقي على هذه الرحلة</div><div style="display:flex;align-items:baseline;gap:6px"><span dir="ltr" style="font-family:Unbounded;font-weight:700;font-size:40px;letter-spacing:-.03em;line-height:1.15">3.876</span><span style="font-size:15px;font-weight:600">د.أ</span></div><div style="font-size:12px;color:#6A6862">دينار أردني</div></div>
        <span style="display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:99px;background:#F4F1EA;margin-bottom:6px;white-space:nowrap"><span style="font:16px/1 'Material Symbols Rounded'">credit_card</span>بطاقة</span>
      </div>
    </div>
  </div>
  <div style="position:absolute;inset:0;background:rgba(20,22,26,.45)"></div>

  <!-- الورقةُ — أختُ «طريقة الدفع» (R06): صفوفٌ بعلامة الاختيار، والالتزامُ بالجمر في قدمٍ ثابتة -->
  <div style="position:absolute;left:0;right:0;bottom:0;background:#F4F1EA;border-radius:30px 30px 0 0;padding:10px 18px 30px;box-shadow:0 -12px 40px rgba(20,22,26,.14)">
    <div style="width:40px;height:5px;border-radius:3px;background:#D2CBBE;margin:0 auto 14px"></div>
    <div style="margin:0 2px 10px;font-size:19px;font-weight:700">الدفع بالبطاقة</div>
    <div style="background:#FFFFFF;border-radius:22px;padding:0 14px">
      <div style="display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #F0ECE4">
        <span style="font:22px/1 'Material Symbols Rounded';color:#6A6862">credit_card</span>
        <div style="flex:1;min-width:0"><div style="font-size:14.5px;font-weight:700"><span dir="ltr">VISA •••• 4242</span></div><div style="margin-top:3px;font-size:13px;color:#6A6862">تنتهي <span dir="ltr">08/2028</span></div></div>
      </div>
      <div style="display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #F0ECE4">
        <span style="font:22px/1 'Material Symbols Rounded';color:#6A6862">credit_card</span>
        <div style="flex:1;min-width:0"><div style="font-size:14.5px;font-weight:700"><span dir="ltr">MASTERCARD •••• 5100</span></div><div style="margin-top:3px;font-size:13px;color:#6A6862">تنتهي <span dir="ltr">02/2027</span></div></div>
      </div>
      <div style="display:flex;align-items:center;gap:12px;padding:14px 0">
        <span style="font:22px/1 'Material Symbols Rounded';color:#6A6862">add</span>
        <div style="flex:1;min-width:0;font-size:14.5px;font-weight:700">بطاقة جديدة</div>
        <span style="font:20px/1 'Material Symbols Rounded';color:#C2410C">check</span>
      </div>
    </div>
    <!-- حفظُ الجديدة قرارُ صاحبها — مربّعُ الموافقة في R03، مطفأٌ ابتداءً -->
    <div style="display:flex;align-items:center;gap:10px;min-height:44px;margin-top:10px;padding:0 4px;font-size:13px;line-height:20px">
      <span style="width:22px;height:22px;flex:none;border-radius:7px;border:1.5px solid #D2CBBE;box-sizing:border-box"></span>
      احفظ هذه البطاقة للدفع بضغطة لاحقاً
    </div>
    <div style="height:58px;margin-top:12px;border-radius:18px;background:#F05A28;color:#14161A;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700">متابعة إلى صفحة الدفع</div>
    <div style="height:54px;margin-top:8px;border-radius:18px;border:1.5px solid #14161A;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600">تراجع</div>
  </div>
</div>
