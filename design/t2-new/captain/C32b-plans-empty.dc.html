<!-- C32b · «عرض الباقات» ولا خطّةَ مفعَّلةً في سوقه — (§٦٢-ج/٣٣) — TAXO 2.0، الكبتن، الإسفلت الليليّ. يُفتح من «عرض الباقات» في C03.
     **عرضٌ بلا شراء**: بطاقاتُ الخطط بلغة C10 بلا دائرة اختيار (لا اختيارَ بلا شراء)، والعمولةُ بنصّ C10، **ومكانُ زرّ الشراء إطارٌ متقطّعٌ**
     — لغةُ الهوية لما لم يُتح بعد (R05 · C04) — يقول «يُتاح الشراءُ بعد اعتماد طلبك» بساعة C03 الرملية. -->
<div dir="rtl" data-screen-label="C32b لا باقات في السوق" style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background:#0E1013;font-family:'Readex Pro',system-ui,sans-serif;color:#F2EFE8;display:flex;flex-direction:column">
<div style="height:50px;flex:none"></div>
<div style="flex:1;display:flex;flex-direction:column;padding:6px 18px 34px">
<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px"><span style="width:44px;height:44px;border-radius:50%;background:#171A1F;border:1px solid #2B3038;display:flex;align-items:center;justify-content:center;box-sizing:border-box;flex:none"><span style="font:22px/1 'Material Symbols Rounded'">arrow_forward</span></span><h2 style="margin:0;font-size:22px;font-weight:700">باقات الاشتراك</h2></div>

<!-- العمولة بنصّ C10 المبنيّ (تصحيحاتُ المالك §١): بلا نسبةٍ ولا وعدٍ مطلق -->
<div style="display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:20px;background:#2A1A12;border:1px solid #5A3322;font-size:13px;line-height:1.6"><span><b>عمولة</b> أقل بكثير من السوق</span></div>

<!-- لا خطّةَ مفعَّلةً في السوق: جملةٌ واحدةٌ في بطاقة الفراغ (t2-empty) — ولا إطارَ «يُتاح الشراء» فوق لا شيء -->
<div style="margin-top:18px;padding:16px;border-radius:20px;background:#171A1F;text-align:center;font-size:12.5px;color:#9097A1">لا باقات معروضة في سوقك الآن.</div>
</div>
