<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>C32 الباقات قيد المراجعة</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300..700&amp;family=Unbounded:wght@500..800&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&amp;display=block">
<style>body{margin:0}</style>
</helmet>
<!-- C32 · «عرض الباقات» لمن طلبُه قيد المراجعة (§٦٢-ج/٣٣) — TAXO 2.0، الكبتن، الإسفلت الليليّ. يُفتح من «عرض الباقات» في C03.
     **عرضٌ بلا شراء**: بطاقاتُ الخطط بلغة C10 بلا دائرة اختيار (لا اختيارَ بلا شراء)، والعمولةُ بنصّ C10، **ومكانُ زرّ الشراء إطارٌ متقطّعٌ**
     — لغةُ الهوية لما لم يُتح بعد (R05 · C04) — يقول «يُتاح الشراءُ بعد اعتماد طلبك» بساعة C03 الرملية. -->
<div dir="rtl" data-screen-label="C32 الباقات قيد المراجعة" style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background:#0E1013;font-family:'Readex Pro',system-ui,sans-serif;color:#F2EFE8;display:flex;flex-direction:column">
<div style="height:50px;flex:none"></div>
<div style="flex:1;display:flex;flex-direction:column;padding:6px 18px 34px">
<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px"><span style="width:44px;height:44px;border-radius:50%;background:#171A1F;border:1px solid #2B3038;display:flex;align-items:center;justify-content:center;box-sizing:border-box;flex:none"><span style="font:22px/1 'Material Symbols Rounded'">arrow_forward</span></span><h2 style="margin:0;font-size:22px;font-weight:700">باقات الاشتراك</h2></div>

<!-- العمولة بنصّ C10 المبنيّ (تصحيحاتُ المالك §١): بلا نسبةٍ ولا وعدٍ مطلق -->
<div style="display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:20px;background:#2A1A12;border:1px solid #5A3322;font-size:13px;line-height:1.6"><span><b>عمولة</b> أقل بكثير من السوق</span></div>

<div style="font-size:15px;font-weight:700;margin:18px 2px 10px">الباقات</div>
<!-- صفوفُ C10 بلا دائرة اختيار — عرضٌ لا زرّ -->
<div style="display:flex;flex-direction:column;gap:7px">
<div style="display:flex;align-items:center;gap:12px;min-height:62px;padding:8px 14px;border-radius:18px;border:1px solid #2B3038;box-sizing:border-box"><div style="flex:1"><div style="font-size:15px;font-weight:600">يومي</div><div style="font-size:12px;color:#9097A1">24 ساعة من لحظة الشراء</div></div><span style="white-space:nowrap"><span dir="ltr" style="font-family:Unbounded;font-weight:600;font-size:15px">1.500</span> <span style="font-size:11px;color:#9097A1">د.أ</span></span></div>
<div style="display:flex;align-items:center;gap:12px;min-height:62px;padding:8px 14px;border-radius:18px;border:1px solid #2B3038;box-sizing:border-box"><div style="flex:1"><div style="font-size:15px;font-weight:600">أسبوعي</div><div style="font-size:12px;color:#9097A1">7 أيام</div></div><span style="white-space:nowrap"><span dir="ltr" style="font-family:Unbounded;font-weight:600;font-size:15px">8.000</span> <span style="font-size:11px;color:#9097A1">د.أ</span></span></div>
<div style="display:flex;align-items:center;gap:12px;min-height:62px;padding:8px 14px;border-radius:18px;border:1px solid #2B3038;box-sizing:border-box"><div style="flex:1"><div style="font-size:15px;font-weight:600">شهري</div><div style="font-size:12px;color:#9097A1">30 يوماً</div></div><span style="white-space:nowrap"><span dir="ltr" style="font-family:Unbounded;font-weight:600;font-size:15px">28.000</span> <span style="font-size:11px;color:#9097A1">د.أ</span></span></div>
</div>

<div style="flex:1"></div>
<!-- مكانُ زرّ C10: إطارٌ متقطّعٌ لا زرّ — «لم يُتَح بعد» بلغة الهوية -->
<div style="display:flex;align-items:center;justify-content:center;gap:8px;height:60px;border-radius:18px;border:1.5px dashed #3A404A;box-sizing:border-box;color:#9097A1;font-size:15px;font-weight:600"><span style="font:20px/1 'Material Symbols Rounded'">hourglass_top</span>يُتاح الشراءُ بعد اعتماد طلبك</div>
</div>
</div>
</x-dc>

class Component extends DCLogic {
  renderVals() { return {}; }

</body>
</html>
