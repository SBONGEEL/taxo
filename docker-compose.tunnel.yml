# طبقةُ النفق — **تُضاف فوق `docker-compose.yml` ولا تحلّ محلَّه** (المرحلة 13).
#
#   docker compose -f docker-compose.yml -f docker-compose.tunnel.yml up -d
#
# بلا هذا الملف يبقى التشغيلُ المحليُّ كما هو حرفاً بحرف: نفسُ المنافذ، ونفسُ
# `VITE_API_BASE_URL: http://localhost:8001`، ونفسُ عناوين عودة البطاقة.
#
# **ولماذا ملفٌّ منفصلٌ لا متغيّراتٌ في الأصل**: العنوانُ الذي يُبنى به التطبيق
# يقرّر إلى أين يخاطب المتصفحُ الخلفيةَ **وأين يفتح المقبس**. فجعلُه متغيّراً في
# الملف الأصلي يعني أن نسيانَ تصديره مرةً واحدةً يوجّه هاتفاً على الإنترنت إلى
# `localhost` — أي إلى الهاتف نفسِه. والفصلُ يجعل الحالتين اختياراً لا سهواً.

services:
  # **الخلفيةُ تقبل النطاقات الأربعة أصلاً؟ لا** — فتُضاف هنا.
  #
  # `CORS_ORIGINS` تُستبدل استبدالاً لا تُضاف إلى الافتراضي (قائمةُ
  # Pydantic تُقرأ كاملةً من البيئة)، فتُكتب المحليةُ معها كي يبقى فتحُ
  # `127.0.0.1:5176` عاملاً بينما النفقُ قائم.
  backend:
    environment:
      CORS_ORIGINS: >-
        ["https://app.tajora.ly","https://driver.tajora.ly","https://admin.tajora.ly",
         "http://localhost:5173","http://localhost:5174","http://localhost:5175",
         "http://localhost:5176","http://127.0.0.1:5173","http://127.0.0.1:5174",
         "http://127.0.0.1:5175","http://127.0.0.1:5176"]
      # **عودةُ صفحة البطاقة تتبع التطبيقَ الذي فتحها** (`card_gateway.return_url_for`):
      # عنوانٌ محليٌّ في جلسةٍ على هاتفٍ يعيد الراكبَ إلى جهازٍ ليس بيده
      CARD_RETURN_URL: https://app.tajora.ly/payments/card/return
      CARD_RETURN_URL_DRIVER: https://driver.tajora.ly/payments/card/return
      # عنوانُ الخلفية كما يراه العالم — تُبنى عليه صفحةُ المزوّد الوهمي
      # (`card_gateway/__init__.py`)، فعنوانٌ محليٌّ فيها يفتح صفحةً لا يبلغها هاتف
      PUBLIC_API_BASE_URL: https://api.tajora.ly


  # **يُخدَم البناءُ المحزَّم لا خادمُ التطوير** (2026-08-14، بعد قياسٍ على النفق):
  # الترحيبيةُ تظهر في 0.72s — لكن الشاشةَ تكتمل في 5.59s عبر **٦٧ طلباً**،
  # لأن Vite يرسل الوحداتِ مفرَّقةً وكلُّ واحدةٍ رحلةٌ عبر Cloudflare. والبناءُ
  # يجمعها في ملفاتٍ معدودة. **والبناءُ على المضيف لا في الحاوية**: حارسا
  #  و يقرآن `backend/app`، والحاويةُ لا تحمله
  # (`ENOENT`) — فتبني أنت ثم تخدم هي `dist`. **وثمنُه صريح**: تعديلُ الكود لا يظهر حتى
  # `npm run build` — فهذا للتجربة على الهاتف لا للتطوير عليه.
  customer-app:
    environment:
      VITE_API_BASE_URL: https://api.tajora.ly
    command: sh -c "npm install && npx vite preview --host 0.0.0.0 --port 5173"

  driver-app:
    environment:
      VITE_API_BASE_URL: https://api.tajora.ly
    command: sh -c "npm install && npx vite preview --host 0.0.0.0 --port 5174"

  admin-panel:
    environment:
      VITE_API_BASE_URL: https://api.tajora.ly
    command: sh -c "npm install && npx vite preview --host 0.0.0.0 --port 5175"

  # النفقُ نفسُه — **اتصالٌ صادرٌ من الجهاز**، فلا منفذَ يُفتح عليه ولا يحتاج
  # `ports`. ويخاطب الخدماتِ عبر `host.docker.internal` لأن `localhost` داخل
  # الحاوية هي الحاويةُ نفسُها (`cloudflared/config.docker.yml`).
  #
  # **ولا `restart: unless-stopped`**: نفقٌ يعود وحدَه بعد إعادة تشغيل الجهاز
  # هو نفقٌ يعمل ليلاً بلا أن يعرف أحد — وهذا بعينه ما يحذّر منه README.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: taxo-tunnel
    restart: "no"
    command: tunnel --config /etc/cloudflared/config.docker.yml run
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
      # اعتمادُ النفق الذي يكتبه `cloudflared tunnel create` على جهازك.
      # **إلى `/creds` لا `/root`**: الصورةُ تعمل بمستخدم 65532، و`/root` مغلقٌ
      # عليه — فالمركَّبُ هناك لا يُرى (`cloudflared/config.docker.yml`)
      - ${USERPROFILE}/.cloudflared:/creds:ro
