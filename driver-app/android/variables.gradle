ext {
    // **24 شرطُ رفعٍ لا اختيار** (٢٠٢٦-١٠-١٤، SPEC §٧٦-د): ردّ Play Console حزمةَ 865 بخطأٍ مانعٍ بنصّه — «تتطلّب ميزة
    // "الحماية التلقائية" في Google Play توفُّر الإصدار 24 من حزمة تطوير البرامج (SDK) كحد أدنى». **والحمايةُ مفعَّلةٌ في
    // الكونسول ولا تُطفأ من هنا** (شرطُ المالك: لا تغييرَ لشيءٍ آخر في Play Console) — **فيسقط أندرويد ٦ وحدَه**.
    minSdkVersion = 24
    // **المستوى 36 شرطُ رفعٍ لا اختيار** — ونصُّ Play للكبتن حرفاً
    // (٢٠٢٦-٠٩-١١): «يستهدف تطبيقك حاليًا المستوى 35 … ويجب أن يستهدف
    // المستوى 36 من واجهة API على الأقل». **والإصدارُ لا يُحفظ دونه.**
    //
    // **وهذا الدرسُ كان مكتوباً في `customer-app` منذ ٢٠٢٦-٠٩-٠٧ ولم
    // يُعمَّم** — أُصلح بابٌ وتُرك أخوه، وهو «بابان ينشران الشيءَ نفسَه
    // ويفترقان» بعينه. **و`admin-panel` ما زال عند 35** ولم يُمسّ هنا
    // (متغيّرٌ واحدٌ في المرّة)، وبندُه مكتوب.
    //
    // **و`compileSdk` يرتفع معه بالضرورة**: أندرويد يشترط
    // `compileSdk >= targetSdk`، **فرفعُ الهدف وحدَه لا يُبنى أصلاً**.
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.9.2'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.4'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.12.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
    cordovaAndroidVersion = '10.1.1'
    // **نسخةُ `firebase-messaging` بيتٌ واحدٌ للملحق وللتطبيق** (§٦٦-ج/١٧، الحزمةُ «2.0»): خدمةُ رنين المكالمة
    // (`CallMessagingService`) ترث خدمةَ ملحق الإشعارات، **والملحقُ يجلب المكتبةَ بـ`implementation` فلا تبلغ
    // ترجمةَ التطبيق** — فيُضيفها التطبيقُ بنفسه. **وهذا السطرُ يقرؤه الملحقُ أيضاً**
    // (`project.hasProperty('firebaseMessagingVersion')`)، فلا تفترق نسختان. **و`24.1.0` هي افتراضُ الملحق 7.0.7
    // نفسُه** — تُرفع هنا وحدَها، ومعها الملحق.
    firebaseMessagingVersion = '24.1.0'
}