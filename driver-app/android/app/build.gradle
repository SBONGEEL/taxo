/** **رقمُ النسخة يُشتقّ ولا يُكتب بيد** (قرارُ المالك 2026-08-21).
 *
 * **العلّةُ مقيسة**: بناءان بـ`versionCode` واحدٍ **حزمةٌ واحدةٌ عند أندرويد**،
 * فلا يُثبَّت الثاني تحديثاً — **ومن يحمّل برقمٍ لم يتغيّر يظنّ أنه حدّث وهو
 * لم يفعل**. ورفعُه بيدٍ شرطٌ يُتذكَّر، وقد نُسي فعلاً: بناءٌ جديدٌ برقمٍ قديم
 * أوقفه `tools/apk-manifest.mjs` عند النشر لا عند البناء.
 *
 * **وعددُ الإيداعات هو المشتقّ**: يزيد أبداً، ويُعاد إنتاجُه من الإيداع نفسِه،
 * **ولا يحتاج ملفَّ عدّادٍ يتعارض بين فرعين**.
 *
 * **والغيابُ يُوقف ولا يُسكت عنه**: بلا `git` — أو في استنساخٍ ضحلٍ لا تاريخَ
 * له — **يفشل البناءُ ويقول لماذا**، ولا يعود إلى `1` صامتاً. فقيمةٌ احتياطيةٌ
 * صامتةٌ هنا **تُنتج بالضبط العطبَ الذي بُني هذا لأجله**، وهي «الشكلُ الثاني
 * عشر»: احتياطٌ ينجح فيخفي ما وُضع له.
 *
 * **ويُتجاوَز بتصريحٍ لا بالسكوت**: `TAXO_VERSION_CODE` لبيئةٍ لا `git` فيها.
 */
static int taxoVersionCode(File root) {
    def declared = System.getenv("TAXO_VERSION_CODE")
    if (declared != null && !declared.trim().isEmpty()) return declared.trim() as int
    try {
        def out = new ByteArrayOutputStream()
        def proc = ["git", "rev-list", "--count", "HEAD"].execute(null, root)
        proc.consumeProcessOutput(out, new ByteArrayOutputStream())
        proc.waitForOrKill(15000)
        def count = out.toString().trim()
        if (proc.exitValue() == 0 && count ==~ /\d+/ && (count as int) > 0) return count as int
    } catch (ignored) {
        // يسقط أدناه برسالةٍ تسمّي السبب — ولا يُبتلع صامتاً
    }
    throw new GradleException(
        "تعذّر اشتقاقُ versionCode من عدد الإيداعات. " +
        "بلا رقمٍ يزيد لا يُقرأ البناءُ تحديثاً على الهاتف. " +
        "مرّر TAXO_VERSION_CODE=<رقم> إن كنت تبني بلا تاريخ git."
    )
}

apply plugin: 'com.android.application'

android {
    namespace "ly.tajora.driver"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ly.tajora.driver"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // **مشتقٌّ من عدد الإيداعات لا مكتوبٌ بيد** — التفصيلُ فوق الملف.
        versionCode taxoVersionCode(rootProject.projectDir)
        versionName "1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // **توقيعُ الإصدار — من البيئة لا من ملفٍّ في الشجرة** (§18.1، مفتاحُ
    // النشر أُنشئ 2026-08-26).
    //
    // **ولا قيمةَ افتراضيةَ لسرّ**: `System.getenv` يعود `null` حين لا يُصدَّر،
    // **فيبقى `signingConfig` غيرَ مضبوطٍ ويسقط البناءُ باسمِ ما نقص** — لا
    // يقع على مفتاحِ تصحيحٍ صامتاً. وهي قاعدةُ `POSTGRES_PASSWORD:?` نفسُها:
    // **بناءٌ ينجح بمفتاحٍ غيرِ المقصود أخطرُ من بناءٍ يسقط.**
    //
    // **والملفُّ يُفكّ في مجرى العمل ولا يدخل git**: `scripts/pre-commit` يرفض
    // `*.jks` حتى مع `git add -f` (قِيس)، والسرُّ في GitHub مُرمَّزٌ بـbase64.
    signingConfigs {
        release {
            def ksPath = System.getenv("ANDROID_KEYSTORE_PATH")
            if (ksPath != null) {
                storeFile file(ksPath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // **يُسند صراحةً** — وبلا المتغيّرات يبقى `storeFile` فارغاً
            // فيسقط `assembleRelease` ويسمّي ما نقص.
            signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
