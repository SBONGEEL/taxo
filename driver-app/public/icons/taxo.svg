<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="TAXO Driver">
  <!-- **أختُ أيقونة الراكب مقلوبةَ اللون** (قرارُ المالك 2026-08-14).
       نفسُ الكلمة ونفسُ الوزن ونفسُ المواضع — والفرقُ **قلبُ اللون** وكلمةُ
       الشريط. فيُعرف التطبيقان من عائلةٍ واحدة، ويُميَّز أحدهما عن الآخر من
       مسافةٍ بلا قراءة: أيقونةُ الكبتن فاتحةٌ بين أيقوناتٍ داكنة.

       واللونان من §1.1 وحدَها (`--bg` و`--tx` في الوضع الليلي)، فلا لونَ
       ثالثٌ يدخل ولا يُستعمل الورديُّ المحجوزُ للسِمة النسائية. -->
  <rect width="512" height="512" rx="114" fill="#e6edf3"/>

  <g fill="none" stroke="#14181d" stroke-width="36" stroke-linecap="round" stroke-linejoin="round">
    <!-- **الأربعةُ بارتفاعٍ واحد** (120) وسماكةٍ واحدة (36): كان `O` قطرُه 116
         وإخوتُه 132، فيُقرأ حرفاً صغيراً معلّقاً لا رابعاً في الكلمة. والقطرُ
         الخارجي هنا = ارتفاعُ الحرف بالضبط. -->
    <path d="M52 176 H132"/>
    <path d="M92 176 V296"/>
    <path d="M152 296 L189 176 L226 296"/>
    <path d="M166 258 H212"/>
    <path d="M246 176 L320 296"/>
    <path d="M320 176 L246 296"/>
    <circle cx="400" cy="236" r="42"/>
  </g>

  <rect x="130" y="344" width="252" height="70" rx="35" fill="#14181d"/>
  <text x="256" y="393" text-anchor="middle" fill="#e6edf3"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="40" font-weight="700" letter-spacing="6">DRIVER</text>
</svg>
