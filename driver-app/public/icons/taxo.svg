  <!-- **علامةُ الكبتن — أختُ علامة الراكب لا نسخةٌ منها** (2026-08-14).
       الحلقةُ نفسُها بالوزن نفسِه (حرف O من الاسم، وهو مؤشِّرُ التحميل في
       الشاشة الترحيبية — `DESIGN.md` §7)، فيُقرأ التطبيقان من عائلةٍ واحدة.

       **والفرقُ شكلٌ لا لون**: مِقودٌ داخل الحلقة — محورٌ وثلاثةُ أذرع. يُقرأ
