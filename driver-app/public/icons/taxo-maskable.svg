<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="TAXO">
  <!-- القابلةُ للقصّ — مولَّدةٌ من `taxo.svg` نفسِه، ومصغَّرةٌ إلى ٪٧٤ فتبقى
       داخل دائرة القناع مهما كان شكلُه. -->
  <rect width="512" height="512" fill="#e6edf3"/>
  <g transform="translate(256 256) scale(0.74) translate(-256 -256)">

  <g fill="none" stroke="#14181d" stroke-width="36" stroke-linecap="round" stroke-linejoin="round">
    <!-- **الأربعةُ بارتفاعٍ واحد** (120) وسماكةٍ واحدة (36): كان `O` قطرُه 116
         وإخوتُه 132، فيُقرأ حرفاً صغيراً معلّقاً لا رابعاً في الكلمة. والقطرُ
         الخارجي هنا = ارتفاعُ الحرف بالضبط. -->
    <path d="M52 176 H132"/>
    <path d="M92 176 V296"/>
    <path d="M152 296 L189 176 L226 296"/>
    <path d="M166 258 H212"/>
    <path d="M246 176 L320 296"/>
    <path d="M320 176 L246 296"/>
    <circle cx="400" cy="236" r="42"/>
  </g>

  <rect x="130" y="344" width="252" height="70" rx="35" fill="#14181d"/>
  <text x="256" y="393" text-anchor="middle" fill="#e6edf3"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="40" font-weight="700" letter-spacing="6">DRIVER</text>
  </g>
</svg>
