<!doctype html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شكراً — TAXO Driver</title>
<link rel="canonical" href="https://taxo.tajora.ly/driver-paid">
<link rel="icon" href="/assets/favicon.png">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="refresh" content="3;url=https://driver.tajora.ly/wallet/pay/return?via=ds24">
<!-- **صفحةُ الشكر لمنتجات Digistore24** (أمرُ المالك ٢٠٢٦-١١-٢٣): Digistore24 يقرأ صفحةَ الشكر بنفسه ويشترط عليها سطرَه الإنجليزيَّ
     («The debit will be performed by Digistore24.com») — **وتطبيقُ الكبتن صفحةٌ واحدةٌ لا يحمل HTMLُها نصَّ شاشة**، فهذه الصفحةُ الثابتةُ
     تحمله ثمّ تعيد إلى «نتيجة الدفع» في التطبيق (`/wallet/pay/return?via=ds24`)، وهناك يُسأل الخادمُ عن الدفعة. **ولا تقيّد شيئاً**:
     القيدُ من إشعار IPN الموقَّع وحدَه. -->
<style>
  :root{--bg:#f2f0eb;--ink:#171b20;--mute:#6e7681;--card:#ffffff;--line:#ddd8cf;--accent:#ff6b2c}
  @media (prefers-color-scheme:dark){:root{--bg:#0e1013;--ink:#eef0f2;--mute:#9aa3ad;--card:#171b21;--line:#2a3038}}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic','IBM Plex Sans',system-ui,sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:56px 16px 96px;text-align:center}
  h1{font-size:26px;line-height:1.4;margin:0 0 12px}
  p{font-size:16px;line-height:1.8;color:var(--mute);margin:0 0 14px}
  .note{color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
  a.cta{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border-radius:999px;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;font-size:16px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>شكراً — نعيدك إلى تطبيق الكبتن</h1>
  <p>يُفعَّل اشتراكك تلقائيّاً حين يصل تأكيدُ الدفع، وتراه في «نتيجة الدفع».</p>
  <p class="note">يتمّ الخصمُ بواسطة Digistore24.com<br><span lang="en" dir="ltr">The debit will be performed by Digistore24.com</span></p>
  <a class="cta" href="https://driver.tajora.ly/wallet/pay/return?via=ds24">إلى نتيجة الدفع</a>
</div>
</body>
</html>
