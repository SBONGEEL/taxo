<body data-doc="terms_of_service">
<div class="wrap">
  <div class="top">
    <a href="/" aria-label="TAXO — الرئيسية"><img src="/assets/logo-ink.webp" loading="lazy" decoding="async" alt="TAXO" width="96" height="18" style="display:block;width:96px;height:auto"></a>
    <a href="/">عودة إلى الرئيسية</a>
  </div>
  <h1>شروط الاستخدام</h1>
  <p class="lede">شروط استخدام TAXO للراكب والكبتن.</p>
  <div class="note" data-policy-state>
    <p><strong>هذه الصفحة لم تُنشر بعد.</strong></p>
    <p style="margin:8px 0 0;color:#6e7681">النصُّ قيدُ المراجعة، ولا يُعرض قبل اعتماده. وحتى ذلك، راسلنا على
      <a href="mailto:privacy@tajora.ly" dir="ltr" style="unicode-bidi:isolate">privacy@tajora.ly</a>.</p>
  </div>
  <article data-policy-body hidden></article>
  <p data-policy-updated hidden style="margin-top:20px;color:#6e7681;font-size:13.5px"></p>
  <footer>
    <p><a href="mailto:privacy@tajora.ly" dir="ltr" style="unicode-bidi:isolate">privacy@tajora.ly</a></p>
    <p><span dir="ltr" style="unicode-bidi:isolate">taxo-joly</span> — عمّان، الأردن</p>
  </footer>
</div>
<script type="module">
/** يقرأ النصَّ **إن أذن المفتاح** — ولا يعرض حرفاً قبله.
 *
 * **والحارسُ في الخلفية لا هنا**: البابُ لا يُخرج نصّاً و`policies_public`
 * مطفأ، **فمن عطّل JavaScript لا يرى شيئاً أيضاً**. وحارسٌ في الواجهة وحدَها
 * يُتجاوَز بـ`curl`.
 */
const doc = document.body.dataset.doc;
try {
  const res = await fetch(`/api/policy?doc_type=${doc}`, { cache: "no-store" });
  if (res.ok) {
    const data = await res.json();
    if (data && data.body_ar) {
      const article = document.querySelector("[data-policy-body]");
      article.innerHTML = "";
      for (const para of data.body_ar.split(/\n{2,}/)) {
        const p = document.createElement("p");
        p.textContent = para.trim();
        if (p.textContent) article.appendChild(p);
      }
      article.hidden = false;
      document.querySelector("[data-policy-state]").remove();
      const stamp = document.querySelector("[data-policy-updated]");
      if (data.published_at) {
        stamp.textContent = "آخر تحديث: " + new Date(data.published_at)
          .toLocaleDateString("ar-u-nu-latn", { year: "numeric", month: "long", day: "numeric" });
        stamp.hidden = false;
      }
    }
  }
} catch { /* الفشلُ صامتٌ — وتبقى حالُ «لم تُنشر» */ }
</script>
