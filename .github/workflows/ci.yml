# **البوّابةُ الثانية من الرفع** (`CLAUDE.md`, قرارُ المالك 2026-08-21):
# استنساخٌ نظيفٌ يشغّل المجموعةَ الكاملة والحرّاسَ وبناءَ الثلاثة.
#
# **ولا يخاطب الإنتاجَ إطلاقاً**: لا سرَّ إنتاجٍ في بيئته، ولا نداءَ إلى
# `stg-*`، ولا مفتاحَ خادم. وقيمُ البيئة هنا **مولَّدةٌ للتشغيل ويُرمى بها**،
# فليست أسراراً ولا تُقرأ كذلك — ولذلك تُكتب في الملفّ صراحةً بلا `secrets`.
#
# **ولا سرَّ في السجل**: لا `env` يُطبع، ولا `set -x` على أمرٍ يحمل قيمة.
name: CI

on:
  push:
    branches: ["**", "!verify/**"]
    tags: ["v*"]
  workflow_dispatch:

# **إلغاءُ ما سبق على الفرع نفسِه**: أخضرُ لإيداعٍ تجاوزَته دفعةٌ أحدثُ لا يعني
# شيئاً، وانتظارُه ينفق دقائقَ على ما لن يُرفع.
#
# **ولا يُلغى على master أبداً** (قرارُ المالك 2026-11-15: «Never cancel a CI run that a deploy gate depends on»): بوّابةُ
# الرفع تقرأ «المجموعةُ عند <إيداع>» من التشغيل الأقدم، والملغاةُ «لم تُقَس» فتُوقف الرفع — وقع مقيساً في رفع 20261115T110943Z.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

# **لا سجلَّ بناءٍ يُرفع أثراً** — `build-push-action` يرفع افتراضاً سجلّاً لكلِّ بناء، فتزدحم الآثارُ بما لا يقرؤه أحد
env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  DOCKER_BUILD_SUMMARY: "false"

jobs:
  # ══════════════ المجموعةُ مقسومةً على وظائفَ متوازية (قرارُ المالك 2026-11-15) ══════════════
  #
  # **الطريقُ الوحيدُ لتشغيل المجموعة في CI** — لا وظيفةَ تشغّلها كاملةً وحدَها. قِيس قبله: **٣٢٧٨ث (٥٥ د) لـ٢٧٦٠ اختباراً
  # في وظيفةٍ واحدة** (CI ‏43707658269)، والهدفُ تشغيلٌ كاملٌ دون عشر دقائق **بلا حذفِ اختبارٍ ولا إضعافِه**.
  #
  # · `plan` يقرأ الأزمنةَ المقيسةَ من التشغيل السابق (ذاكرةُ Actions) ويحسب **عددَ الوظائف** (`scripts/ci_plan.py`)
  #   — فحين تكبر المجموعةُ تكثر الوظائفُ وحدَها، ولا رقمَ يُكتب بيد.
  # · `backend` وظيفةٌ لكلِّ جزء، وفي كلٍّ **عمّالٌ بعدد الأنوية** (`pytest -n`)، لكلِّ عاملٍ قاعدتُه وRedisُه.
  #   والتوزيعُ بالأزمنة لا بقائمة (`tests/shard_plugin.py`): **ملفٌّ جديدٌ يقع في وظيفةٍ وحدَه**.
  # · `suite` **«المجموعةُ الكاملة»** — يجمع التقارير ويُسقط CI إن **شُغّل أقلُّ ممّا جُمع** (`scripts/ci_shards_check.py`)،
  #   ويطبع أسماءَ الساقط فيقرؤها `scripts/deploy_ci_gate.py` كما كان يقرؤها من الوظيفة الواحدة. **واسمُه هو الذي تحكم به
  #   بوّابةُ الرفع** — فلا يُغيَّر.
  plan:
    name: خطّةُ التقسيم
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      count: ${{ steps.plan.outputs.count }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      # **أحدثُ أزمنةٍ محفوظة** — والمفتاحُ لا يُطابَق أبداً عمداً، فتُؤخذ أحدثُ ما يبدأ بالبادئة
      - uses: actions/cache/restore@v4
        with:
          path: backend/.ci/durations.json
          key: test-durations-plan-${{ github.run_id }}
          restore-keys: test-durations-
      - id: plan
        run: |
          mkdir -p backend/.ci
          [ -f backend/.ci/durations.json ] || echo '{}' > backend/.ci/durations.json
          python3 scripts/ci_plan.py backend/.ci/durations.json
      # **ملفُّ أزمنةٍ واحدٌ لكلِّ الوظائف** — لو قرأت كلُّ وظيفةٍ الذاكرةَ بنفسها لَأمكن أن تقرأ اثنتان نسختين فيفترق التقسيم
      - uses: actions/upload-artifact@v4
        with:
          name: durations-in
          path: backend/.ci/durations.json
          retention-days: 3
          include-hidden-files: true

  # **صورةُ الخلفية تُبنى مرّةً لا في كلِّ جزء** — وقع مقيساً في التشغيل 43716600094: ستّةُ أجزاءٍ تبني معاً بذاكرةٍ باردة،
  # فسقط أحدُها بانقطاعٍ في جلب مفتاح postgresql.org **قبل أن يبدأ اختبارٌ واحد**. فالبناءُ هنا يكتب ذاكرةَ الطبقات،
  # والأجزاءُ تقرؤها وحدَها (`cache-from` بلا `cache-to`) فلا تخرج إلى الشبكة.
  image:
    name: صورةُ الخلفية
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,scope=backend-image,mode=max

  backend:
    name: المجموعةُ — جزء ${{ matrix.shard }}/${{ needs.plan.outputs.count }}
    needs: [plan, image]
    runs-on: ubuntu-latest
    # **مساوٍ لأخيه `batch-suite`** — `check:ci-timeouts` يحرس التطابق. والهدفُ دون عشر دقائق؛ والسقفُ للعطب لا للعادة
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      COMPOSE_PROJECT_NAME: taxo
    steps:
      - uses: actions/checkout@v4

      # **قيمٌ للتشغيل وحدَه** — ولا احتياطَ صامتٌ لسرّ: الملفُّ يُكتب كاملاً فيقف الإقلاعُ إن نقص مفتاحٌ بدل أن يقع على افتراض.
      - name: بيئةُ التشغيل
        run: bash scripts/ci_env.sh

      # **صورةُ الخلفية بذاكرة الطبقات** — طبقةُ المتطلّبات لا تُبنى من الصفر إلا حين يتغيّر `requirements.txt`
      - uses: docker/setup-buildx-action@v3
      - name: بناءُ صورة الخلفية
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: taxo-backend:latest
          cache-from: type=gha,scope=backend-image

      # **القاعدةُ وRedis تُقامان هنا** — و`suite.sh` يمرّ بـ`--no-deps` عمداً فلا يُقيمهما.
      - name: القاعدةُ وRedis
        env:
          TAXO_ENV_FILE: .env
        run: bash scripts/ci_db_up.sh

      - uses: actions/download-artifact@v4
        with:
          name: durations-in
          path: backend/.ci

      # **البابُ الوحيدُ للمجموعة** — هو نفسُه محلياً وهنا، فلا تفترق بيئتان
      - name: جزءٌ من المجموعة
        env:
          SUITE_SHARD: ${{ matrix.shard }}/${{ needs.plan.outputs.count }}
          SUITE_DURATIONS: .ci/durations.json
          SUITE_REPORT: .ci/shard-${{ matrix.shard }}
        run: TAXO_ENV_FILE=.env bash scripts/suite.sh

      - name: التقريرُ إلى «المجموعةُ الكاملة»
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: |
            backend/.ci/shard-${{ matrix.shard }}.*.json
            backend/.suite.out
          retention-days: 3
          if-no-files-found: warn
          include-hidden-files: true

      # **الأثرُ يصل كاملاً** — والرأسُ موضعُ الأثر، والعنوانُ يُقنَّع («لا سرَّ في سجلّ CI»)، والقطعُ كالسقوط (`cancelled()`).
      - name: النتيجةُ كاملةً عند السقوط
        if: failure() || cancelled()
        run: bash scripts/ci_suite_trace.sh

  suite:
    name: المجموعةُ الكاملة
    needs: [plan, backend]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # **تقاريرُ الأجزاء وحدَها** — لا كلُّ ما رُفع: سجلّاتُ البناء (`.dockerbuild`) أسقطت تنزيلاً في التشغيل 43716600094
      - uses: actions/download-artifact@v4
        with:
          path: reports
          pattern: shard-*
      - uses: actions/download-artifact@v4
        with:
          name: durations-in
          path: reports/durations-in
      - name: كلُّ ما جُمع شُغّل — والساقطُ بأسمائه
        run: |
          python3 scripts/ci_shards_check.py reports "${{ needs.plan.outputs.count }}" backend/.ci/durations.json reports/durations-in/durations.json
      - name: الوظائفُ نفسُها خضراء
        if: always()
        run: |
          [ "${{ needs.backend.result }}" = success ] || { echo "✗ جزءٌ من المجموعة لم يخضرّ: ${{ needs.backend.result }}"; exit 1; }
      # **زمنُ التشغيل كلِّه مقيساً** — وإن تجاوز العشرَ قيل في الملخّص، والتشغيلُ التالي يزيد الوظائفَ من الأزمنة الجديدة وحدَه
      - name: زمنُ التشغيل
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          started=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" --jq .run_started_at)
          secs=$(( $(date -u +%s) - $(date -u -d "$started" +%s) ))
          line="زمنُ التشغيل حتى «المجموعةُ الكاملة»: $((secs / 60))د $((secs % 60))ث على ${{ needs.plan.outputs.count }} وظيفة"
          echo "$line"; echo "- $line" >> "$GITHUB_STEP_SUMMARY"
          if [ "$secs" -gt 600 ]; then
            echo "- ⚠ **تجاوز عشرَ دقائق** — التشغيلُ التالي يعيد الحسابَ من هذه الأزمنة (\`scripts/ci_plan.py\`)؛ وإن تكرّر فالميزانيةُ تُراجَع" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/cache/save@v4
        if: success()
        with:
          path: backend/.ci/durations.json
          key: test-durations-${{ github.run_id }}-${{ github.run_attempt }}

  # ════════════════════════════════════════════════════════════════════════
  # **الملفّاتُ الخمسة** (قرارُ المالك 2026-08-25): نُقل من `CLAUDE.md`
  # ما لا يحكم كلَّ قرار إلى أربعة ملفّاتٍ **مربوطةٍ بشروطٍ صريحة**.
  #
  # **وخطرُه واحد**: منقولٌ لا طريقَ إليه — وهو «بابٌ بلا زرّ» في ثوب
  # توثيق، **ولا يفشل به شيءٌ أبداً**. فالحارسُ يقيس الاتجاهين ويطبع الرقمين.
  # ══════════════════ الإيداعُ داخل الدفعة (قرارُ المالك 2026-08-30) ══════════
  #
  # **الثقبُ الذي سدّه هذا** (مقيسٌ 2026-08-30): Actions يُشغَّل على **رأس ما
  # دُفع** — **فإيداعٌ داخل دفعةٍ لا يُختبر أبداً**. و`76827fc` كان رابعَ خمسةٍ
  # في دفعة، **ولا تشغيلَ له قطّ**، فخلّف ستَّ حمرٍ عاشت يوماً كاملاً.
  # **والقاعدةُ تقول «لا يُودَع على مجموعةٍ حمراء»، والمجموعةُ عليه لم تُشغَّل**:
  # لم يقل البابُ «لا» — **لم يُسأل**.
  #
  # **وما يملكه وما لا يملكه، صراحةً**: يشغّل **المجموعةَ وحدَها** على كلِّ
  # إيداعٍ **عدا الرأس** (الرأسُ تغطّيه `backend` أصلاً). **ولا يشغّل الحرّاسَ
  # ولا بناءَ الثلاثة على الوسط** — تلك تُقاس على الرأس، **وثمنُها أربعةُ
  # أضعافٍ لا يشتري قدرَه**. وحارسٌ يوحي بتغطيةٍ لا يملكها أسوأُ من غيابه.
  #
  # **ولا يمنع الدفع**: هو تقريرٌ بعد الدفع كبقيّة CI — **والبوّابةُ الحقيقيّةُ
  # حمايةُ فرعٍ** تحتاج حساباً، وهي بندٌ مكتوبٌ في `STATE.md` بثمنه.
  batch:
    name: إيداعاتُ الدفعة
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      commits: ${{ steps.pick.outputs.commits }}
      dropped: ${{ steps.pick.outputs.dropped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: إيداعاتُ هذه الدفعة عدا رأسِها
        id: pick
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          empty=0000000000000000000000000000000000000000
          # **فرعٌ جديدٌ أو دفعةٌ قسرية**: `before` أصفارٌ أو ليس في الشجرة —
          # **فلا نطاقَ يُحسب**، والرأسُ وحدَه يُقاس ولا يُدَّعى غيرُ ذلك.
          if [ "$BEFORE" = "$empty" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "لا سلفَ معروفٌ لهذه الدفعة — الرأسُ وحدَه يُقاس"
            echo 'commits=[]' >> "$GITHUB_OUTPUT"
            echo 'dropped=0' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # **عدا الرأس**: `^$GITHUB_SHA^@` ليست حيلةً — الرأسُ له وظيفتُه
          all=$(git rev-list --reverse "$BEFORE..$GITHUB_SHA" | grep -v "^$GITHUB_SHA$" || true)
          total=$(printf '%s' "$all" | grep -c . || true)

          # **سقفٌ يُعلن ولا يُسكت عنه**: دفعةٌ من مئةٍ تُشعل مئةَ وظيفة.
          # **ولا سقفَ صامت** — ما سقط يُقال عدداً في السجلّ وفي الملخّص.
          keep=$(printf '%s' "$all" | tail -n 12)
          kept=$(printf '%s' "$keep" | grep -c . || true)
          dropped=$((total - kept))

          echo "في الدفعة $total إيداعاً عدا الرأس · يُقاس منها $kept · أُسقط $dropped"
          if [ "$dropped" -gt 0 ]; then
            echo "⚠ أُسقط $dropped إيداعاً أقدمَ من الاثني عشر الأخيرة — **ولم تُقَس**" >> "$GITHUB_STEP_SUMMARY"
          fi

          json=$(printf '%s' "$keep" | python3 -c 'import sys,json; print(json.dumps([l for l in sys.stdin.read().split() if l]))')
          echo "commits=$json" >> "$GITHUB_OUTPUT"
          echo "dropped=$dropped" >> "$GITHUB_OUTPUT"

  # **الإيداعاتُ الوسيطة واحداً واحداً — بالمجموعة السريعة** (قرارُ المالك 2026-11-15): كلُّ اختبارات المال والدفتر والدفع
  # والأمن والصلاحيات وحرّاسِ العقد، **ومعها اختباراتُ ما غيّره الإيداع** (`scripts/ci_fast_set.py`). **والرأسُ وحدَه يُختبر
  # كاملاً** في `backend`/`suite` — وهو ما يُرفع.
  #
  # **وأدواتُ التشغيل من الرأس لا من الإيداع**: إيداعٌ أقدمُ من التوازي لا يحمل `shard_plugin` ولا `ci_fast_set`، فتُنسخ إليه
  # من الرأس. **وعمّالُه بقدر ما يحتمل**: شجرةٌ لا تعزل العمّال (لا `PYTEST_XDIST_WORKER` في `conftest`) تُشغَّل متتابعةً —
  # والتوازي على ما لا يعزل يُنتج حمرةً كاذبة.
  batch-suite:
    name: المجموعةُ عند ${{ matrix.commit }}
    needs: batch
    if: needs.batch.outputs.commits != '[]'
    runs-on: ubuntu-latest
    # **مساوٍ لأخيه `backend`** — `check:ci-timeouts`
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        commit: ${{ fromJSON(needs.batch.outputs.commits) }}
    env:
      COMPOSE_PROJECT_NAME: taxo
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.commit }}
          fetch-depth: 2

      - uses: actions/checkout@v4
        with:
          path: _head
          sparse-checkout: |
            scripts
            backend/tests/shard_plugin.py
          sparse-checkout-cone-mode: false

      - name: أدواتُ الرأس والمجموعةُ السريعة
        run: |
          set -euo pipefail
          cp _head/scripts/suite.sh _head/scripts/ci_env.sh _head/scripts/ci_db_up.sh _head/scripts/ci_suite_trace.sh scripts/
          cp _head/backend/tests/shard_plugin.py backend/tests/shard_plugin.py
          mkdir -p backend/.ci
          python3 _head/scripts/ci_fast_set.py . "${{ matrix.commit }}" backend/.ci/fast-set.txt
          if grep -q PYTEST_XDIST_WORKER backend/tests/conftest.py && grep -q '^pytest-xdist' backend/requirements.txt; then
            echo "SUITE_WORKERS=$(nproc)" >> "$GITHUB_ENV"
          else
            echo "SUITE_WORKERS=0" >> "$GITHUB_ENV"
            echo "⚠ شجرةٌ أقدمُ من عزل العمّال — تُشغَّل متتابعة" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: بيئةُ التشغيل
        run: bash scripts/ci_env.sh

      - uses: docker/setup-buildx-action@v3
      - name: بناءُ صورة الخلفية
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: taxo-backend:latest
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,scope=backend-image,mode=max

      - name: القاعدةُ وRedis
        env:
          TAXO_ENV_FILE: .env
        run: bash scripts/ci_db_up.sh

      - name: المجموعةُ السريعة
        env:
          SUITE_SELECT: .ci/fast-set.txt
        run: TAXO_ENV_FILE=.env bash scripts/suite.sh

      - name: أثرُ السقوط
        if: failure() || cancelled()
        run: |
          echo "### ✗ ${{ matrix.commit }}" >> "$GITHUB_STEP_SUMMARY"
          bash scripts/ci_suite_trace.sh

  docs:
    name: الملفّاتُ الخمسة
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tools/check-docs.mjs

  places-search:
    name: ترتيبُ البحث المفتوح
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # فهرسٌ صغيرٌ يُبنى في الاختبار نفسِه؛ والفهرسُ الحقيقيُّ (١٠٦ MB) يُقاس باختبار الـ١٠٥ خارج CI
      - run: python3 -I places-search/test_server.py

  frontends:
    name: الحرّاسُ وبناءُ الثلاثة
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: customer-app
            target: https://api.tajora.ly
          - app: driver-app
            target: https://api.tajora.ly
          # **هدفُ البناء يتبع هدفَ النشر** (قرارُ المالك 2026-08-30).
          # **وكان `https://stg-api.tajora.ly`** — بقيّةٌ ممّا قبل قلب
          # الأسماء، **وهدفٌ لا يقصده إلا هذه المصفوفة**: قِيس أن اللوحةَ
          # الحيّةَ على `stg-admin.tajora.ly` تنادي `api.tajora.ly` (مقروءاً
          # من حزمتها لا من ظنّ)، وأن `deploy.sh` يبني الثلاثةَ بـ`FRONT_API`
          # واحدٍ هو `api.tajora.ly`.
          #
          # **وخُضرةٌ على هدفٍ لا يُشحن تقول «تُبنى على هدفٍ ما»** لا «تُبنى
          # على هدفها» — و`check:target` يبقى أخضرَ صادقاً لأنه يقيس المُعلَنَ
          # مقابل المبنيّ، **والفجوةُ بين مُعلَنِ CI ومُعلَنِ النشر خارج نطاقه**.
          - app: admin-panel
            target: https://api.tajora.ly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - run: npm ci
        working-directory: ${{ matrix.app }}

      # **بهدفٍ مُصرَّحٍ به**: `check:target` يرفض بناءً بلا هدف، وهو المقصود —
      # حزمةٌ بلا هدفٍ هي التي تقف على «الشبكة ضعيفة» في يدِ إنسان.
      #
      # و`check:served` يمرّ هنا بلا خادم: يسقط على **الاختلاف** لا على الغياب،
      # ويقول «لم يُقس» صراحةً بدل أن يسكت.
      - run: npm run build
        working-directory: ${{ matrix.app }}
        env:
          VITE_API_BASE_URL: ${{ matrix.target }}

      # **اختباراتُ الوحدة في الواجهة** (قِيس 2026-11-18): `customer-app/tests` كُتبت ولم يشغّلها CI قطّ — فسقط
      # `glyphs.test.ts` على أيقونتين بلا رسمٍ **ولم يره أحد**. `--if-present` لأنّ لكلِّ تطبيقٍ ما كُتب له.
      - run: npm run test:unit --if-present
        working-directory: ${{ matrix.app }}

  # **نسبةُ الخريطة لا تنفتح وحدَها** (أمرُ المالك ٢٠٢٦-١١-١٨ السابع، المهمّة ١-٥) — متصفّحٌ بـMapLibre الذي يُشحن والحارسِ نفسِه،
  # خمسُ شاشاتٍ نهاراً وليلاً، ومقيسٌ في الاتجاهين (خريطةٌ بلا حارسٍ يجب أن تُرى مفتوحة)
  attribution:
    name: نسبةُ الخريطة
    # **24.04 مثبَّتاً** (قِيس ٢٠٢٦-١١-١٨، التشغيل 44333959166): ubuntu-latest صار 26.04 وPlaywright 1.56 لا يدعمه فيسقط التنصيب
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: customer-app/package-lock.json
      - run: npm ci
        working-directory: customer-app
      - run: npm install --no-package-lock && npx playwright install --with-deps chromium
        working-directory: tools/check-attribution
      - run: node tools/check-attribution/check-attribution.mjs

  # ═══════════════════════════════════════════════════════════════════════
  # **الحزمُ تُبنى هنا وتُنشر أثراً — لا من جهاز أحد** (قرارُ المالك 2026-08-21)
  #
  # **والعلّةُ أن البوّابةَ الرابعة تقول «الخادمُ يسحب نفسَ ما خضّره CI»** —
  # وكانت الحزمةُ تُبنى على جهاز المالك **ولا شيءَ يربطها بCI**، فالجملةُ
  # صادقةٌ في الكود وكاذبةٌ في الحزمة. والبديلُ المرفوض إدخالُ الثنائيات في
  # git: **يثقل التاريخَ أبداً بما لا يخزّنه git أصلاً**.
  #
  # **وعلى الأوسمة وحدَها**: بناءُ أندرويد بطيء، وإصدارٌ لكلِّ دفعةٍ إنفاقٌ بلا
  # قارئ. **والوسمُ هو ما يسحبه الخادم**، فيصير ما تخدمه الصفحةُ = ما بناه CI
  # = وسمُه — **ثلاثةٌ مقيسةٌ لا مكتوبة**.
  #
  # **والتوقيعُ تنقيحيٌّ حتى يصل مفتاحُ النشر** (المواصفة §18.1) — يُقال ولا
  # يُسكت عنه: أولُ حزمةٍ بمفتاح الإصدار **لا تُحدِّث المثبَّت**.
  packages:
    name: الحزمُ وإصدارُها
    needs: [suite, frontends]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # **التاريخُ كاملاً**: `versionCode` يُشتقّ من عدد الإيداعات،
          # **واستنساخٌ ضحلٌ يجعله رقماً كاذباً** — والبناءُ يقف عمداً بلا تاريخ
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # **المفتاحُ يُفكُّ إلى ملفٍّ مؤقّتٍ خارج الشجرة** — لا في المستودع ولا
      # في مجلَّدٍ يُرفع أثراً. ويعيش عمرَ المجرى وحدَه.
      - name: مفتاحُ التوقيع
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          # **وغيابُ السرِّ يوقف باسمه** — لا يقع على مفتاح تصحيحٍ صامتاً
          [ -n "${KS_B64:-}" ] || { echo "✗ السرُّ ANDROID_KEYSTORE_B64 غيرُ مضبوط — لا توقيعَ ولا حزمة."; exit 1; }
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/taxo-release.jks"
          # **يُقاس أنه مخزنٌ لا نصٌّ فارغ** — و`base64` لا يشكو من مدخلٍ خاطئ
          [ -s "$RUNNER_TEMP/taxo-release.jks" ] || { echo "✗ المخزنُ فارغٌ بعد فكِّ الترميز."; exit 1; }
          echo "  ✓ المخزنُ فُكَّ ($(stat -c%s "$RUNNER_TEMP/taxo-release.jks") بايت)"

      # **أربعُ حزمٍ لا حزمتان** (`channels.json`، قرارُ المالك 2026-08-26):
      # قناتان × تطبيقان. **والقناةُ تُصرَّح ولا تُفترض** — `TAXO_CHANNEL` غيرُ
      # مضبوطٍ **يوقف** `capacitor.config.ts` باسمه، وهو ما يجعل «نسخةً عامّةً
      # بُنيت على عنوان جهاز مطوّر» مستحيلةً لا مستبعَدة.
      #
      # **ونكهةُ gradle تُقرأ من الجدول لا تُكتب هنا**: `test` محجوزٌ في AGP
      # فنكهتُها `trial` — **واسمان يفترقان في ملفَّين هو ما يمنعه الجدول**.
      # **إعدادُ Firebase يُفكُّ إلى مكانه في التطبيقين** — وهو مُتجاهَلٌ في
      # git بحقّ (يحمل مفاتيحَ عميلٍ ومعرّفاتِ مشروع)، **فبيتُه سرُّ المستودع**.
      #
      # **ولمَ صار خطوةً**: بلا هذا كان `google-services.json` غائباً في CI
      # **فتُبنى الحزمُ المنشورةُ بلا إشعاراتٍ وبناؤها أخضر** — قِيس في
      # `v0.2.0`: لا `project_id` ولا رقمَ مشروعٍ داخل الحزمتين.
      - name: إعدادُ Firebase للتطبيقين
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_B64 }}
        run: |
          set -euo pipefail
          # **وغيابُ السرِّ يوقف باسمه** — لا يقع على بناءٍ بلا إشعاراتٍ صامتاً
          [ -n "${GS_B64:-}" ] || { echo "SECRET_MISSING GOOGLE_SERVICES_B64"; exit 1; }
          for app in customer-app driver-app; do
            printf '%s' "$GS_B64" | base64 -d > "$app/android/app/google-services.json"
            # **يُقاس أنه JSON بعملاءَ لا نصٌّ فارغ** — و`base64` لا يشكو من مدخلٍ خاطئ
            python3 - "$app/android/app/google-services.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1], encoding="utf-8"))
          clients = [c["client_info"]["android_client_info"]["package_name"] for c in d["client"]]
          print(f"  ✓ {sys.argv[1]}: {d['project_info']['project_id']} · {len(clients)} عملاء")
          need = {"ly.tajora.rider", "ly.tajora.driver", "ly.tajora.rider.test", "ly.tajora.driver.test"}
          missing = need - set(clients)
          if missing:
              raise SystemExit(f"✗ عملاءُ ناقصون في السرّ: {sorted(missing)}")
          PY
          done

      # === غلافُ المشرف — **خامسٌ خارج الأربع، ولا يمسّ منطقَها** (2026-09-01)
      #
      # **خطوةٌ مستقلّةٌ لا توسيعٌ للحلقة**: الأربعُ حزمٌ عامّةٌ تنزل صفحةَ
      # التحميل، وهذه **خاصّةٌ تُثبَّت باليد** (`private: true` في الجدول،
      # ويحرسه `tools/check-apk.mjs`). **وخلطُها بالحلقة يجعل عطبَها عطبَ
      # الأربع** — وهو ما مُنع صراحةً.
      #
      # **والتخطّي معلَنٌ لا صامت**: السرُّ `GOOGLE_SERVICES_B64` يلزم أن يحمل
      # ستّةَ عملاء، **وكان أربعةً** — فحتى يُحدَّث تُبنى الأربعُ ويُقال إن
      # الخامسَ لم يُبنَ **وسببُه**. ولولا هذا لسقطت حزمُ الناس على سرٍّ ينقصه
      # عميلٌ لتطبيقٍ لا ينزّله أحد.
      #
      # **ولا يستر التخطّي عطباً**: «حزمةُ مشرفٍ بلا Firebase» **مستحيلةٌ لا
      # مستبعَدة** — `admin-panel/android/app/build.gradle` يرمي
      # `GradleException` بلا الملفّ (قِيس بالنفي). فالمتخطَّى **بناءٌ لم يقع**،
      # لا بناءٌ وقع ناقصاً.
      - name: غلافُ المشرف — بحزمتيه، إن كان السرُّ يحملهما
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_B64 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/taxo-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          printf '%s' "$GS_B64" | base64 -d > admin-panel/android/app/google-services.json
          if ! python3 - admin-panel/android/app/google-services.json <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1], encoding="utf-8"))
          clients = {c["client_info"]["android_client_info"]["package_name"] for c in d["client"]}
          need = {"ly.tajora.admin", "ly.tajora.admin.test"}
          missing = need - clients
          if missing:
              print(f"ADMIN_CLIENTS_MISSING {sorted(missing)}")
              raise SystemExit(1)
          print(f"  ✓ عميلا المشرف في السرّ ({len(clients)} عملاء جملةً)")
          PY
          then
            rm -f admin-panel/android/app/google-services.json
            echo "ADMIN_APK_SKIPPED — السرُّ GOOGLE_SERVICES_B64 لا يحمل عميلَي المشرف."
            echo "  والأربعُ العامّةُ غيرُ متأثّرة. لبنائه: حدِّث السرَّ بملفٍّ من Firebase فيه"
            echo "  ly.tajora.admin و ly.tajora.admin.test، ثمّ أعِد الوسم."
            exit 0
          fi
          ( cd admin-panel && npm ci --silent )
          for channel in public test; do
            flavor="$(node -e "import('./tools/channels.mjs').then(m=>process.stdout.write(m.TABLE.channels['$channel'].gradleFlavor))")"
            task="assemble$(printf '%s' "$flavor" | sed 's/^./\U&/')Release"
            echo "---- admin-panel | channel=$channel | flavor=$flavor | $task ----"
            TAXO_CHANNEL="$channel" node tools/build-channel.mjs admin-panel
            ( cd admin-panel && TAXO_CHANNEL="$channel" npx cap sync android )
            ( cd admin-panel/android && TAXO_CHANNEL="$channel" sh gradlew "$task" --no-daemon -q )
          done
          # **والتوقيعُ يُقرأ من الحزمة لا من سجلِّ البناء** — كالأربع
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -1)"
          for flavor in public trial; do
            f="admin-panel/android/app/build/outputs/apk/$flavor/release/app-$flavor-release.apk"
            [ -f "$f" ] || { echo "APK_MISSING $f"; exit 1; }
            "$APKSIGNER" verify --print-certs "$f" | grep -Ei 'SHA-256 digest|Signer #1 certificate DN'
          done

      - name: بناءُ الأربع
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/taxo-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for v in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            # **يُسمّى الناقصُ ولا تُطبع قيمةُ الموجود**
            [ -n "$(eval echo \"\$$v\")" ] || { echo "SECRET_MISSING $v"; exit 1; }
          done
          for app in customer-app driver-app; do
            ( cd "$app" && npm ci --silent )
            for channel in public test; do
              flavor="$(node -e "import('./tools/channels.mjs').then(m=>process.stdout.write(m.TABLE.channels['$channel'].gradleFlavor))")"
              task="assemble$(printf '%s' "$flavor" | sed 's/^./\U&/')Release"
              # **وحزمةُ Play (AAB) للعامّة تُبنى هنا لا على جهاز المالك** (أمرُ المالك ١٨/١١ السادس: «البناءُ على GitHub») —
              # في نداء gradle نفسِه بعد مزامنة القناة العامّة، فلا تُبنى من مزامنة التجريبيّة
              [ "$channel" = public ] && task="$task bundle$(printf '%s' "$flavor" | sed 's/^./\U&/')Release"
              echo "---- $app | channel=$channel | flavor=$flavor | $task ----"
              # **بابٌ واحدٌ يشتقّ العنوانَ من الجدول** — لا عنوانَ مكتوباً هنا
              TAXO_CHANNEL="$channel" node tools/build-channel.mjs "$app"
              ( cd "$app" && TAXO_CHANNEL="$channel" npx cap sync android )
              # **`sh gradlew` لا `./gradlew`** — وقع مقيساً (خروج ١٢٦):
              # صلاحيةُ التنفيذ لا يحفظها ويندوز، فالملفُّ يُدفع بلا `+x`.
              # shellcheck disable=SC2086 — مهمّتان في نداءٍ واحدٍ للعامّة
              ( cd "$app/android" && TAXO_CHANNEL="$channel" sh gradlew $task --no-daemon -q )
            done
          done

      # **التوقيعُ يُقرأ من الحزمة لا من سجلِّ البناء** (خطوةُ الصفر): سطرٌ
      # يقول «وقّعتُ» ليس توقيعاً — و`apksigner` يقرأ الشهادةَ من داخل الملفّ.
      # **والأربعُ تُقاس لا واحدة**: `build.gradle` ملفّان منفصلان، وتطابقُ
      # أحدهما لا يشهد للآخر (الشكلُ الثامن).
      - name: التوقيعُ مقروءاً من الأربع
        run: |
          set -euo pipefail
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -1)"
          seen=0
          for app in customer-app driver-app; do
            for flavor in public trial; do
              f="$app/android/app/build/outputs/apk/$flavor/release/app-$flavor-release.apk"
              [ -f "$f" ] || { echo "APK_MISSING $f"; exit 1; }
              echo "---- $f ----"
              "$APKSIGNER" verify --print-certs "$f" | grep -Ei 'SHA-256 digest|Signer #1 certificate DN'
              seen=$((seen+1))
            done
          done
          # **العددُ يُقاس** — ثلاثةٌ من أربعٍ تمرّ صامتةً لولا هذا السطر
          [ "$seen" -eq 4 ] || { echo "SIGNED_COUNT $seen of 4"; exit 1; }
          # **وحزمتا Play (AAB) تُقرأ شهادتُهما من الملفّ** — `keytool -printcert -jarfile`، ومعهما ملفُّ R8 لكلٍّ
          for app in customer-app driver-app; do
            f="$app/android/app/build/outputs/bundle/publicRelease/app-public-release.aab"
            [ -f "$f" ] || { echo "AAB_MISSING $f"; exit 1; }
            echo "---- $f ($(stat -c%s "$f") بايت) ----"
            keytool -printcert -jarfile "$f" | grep -E 'Owner:|SHA256:' | head -2
            [ -f "$app/android/app/build/outputs/mapping/publicRelease/mapping.txt" ] || echo "  · لا ملفَّ R8"
          done

      # **حزمتا Play أثرُ تشغيلٍ لا مرفقُ إصدار** — تُنزَّلان وتُرفعان بـ`scripts/play_api.py upload`، والبنيةُ محفوظةٌ ليجد الرافعُ
      # ملفَّ R8 بجانب الحزمة (`outputs/mapping/publicRelease/`)
      - name: حزمتا Play
        uses: actions/upload-artifact@v4
        with:
          name: play-bundles
          path: |
            customer-app/android/app/build/outputs/bundle/publicRelease/
            customer-app/android/app/build/outputs/mapping/publicRelease/mapping.txt
            driver-app/android/app/build/outputs/bundle/publicRelease/
            driver-app/android/app/build/outputs/mapping/publicRelease/mapping.txt
          retention-days: 30

      # **والعامّتان لا تُرفقان — تُبنيان وتُقاس شهادتُهما أعلاه وحدَه** (قرارُ المالك ٢٠٢٦-١٠-١٨، SPEC §٧٩).
      #
      # **حزمةُ صفحة التحميل هي ما يوقّعه Google Play** لا ما يوقّعه مفتاحُ الرفع هنا: Play يعيد التوقيعَ بمفتاحه، **وحزمةٌ عامّةٌ
      # بمفتاح الرفع على الصفحة لا يحدّثها Play أبداً** — وهو ما رفض تحديثَ هاتف المالك من المتجر (٢٠٢٦-١٠-١٨). فحزمتا الصفحة
      # تُنزَّلان من Play بعد الرفع (`scripts/site-apks.sh`) وتُرفقان بهذا الإصدار نفسِه.
      #
      # **والإصدارُ قد يسبق CI**: `site-apks.sh` ينشئه بحزمتَي Play حين لا يوجد — **فيُرفَق إليه ولا يُنشأ ثانيةً**.
      - name: الإصدارُ وأثرُه — التجريبيّتان وحدَهما
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # **التجريبيّةُ تخاطب جهازَ مطوّر**، فمكانُها الإصدارُ لمن يقصدها لا صفحةٌ عامّة — ومعرّفُها `.test` فلا تحجب Play.
          cp customer-app/android/app/build/outputs/apk/trial/release/app-trial-release.apk taxo-rider-trial.apk
          cp driver-app/android/app/build/outputs/apk/trial/release/app-trial-release.apk  taxo-driver-trial.apk
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" taxo-rider-trial.apk taxo-driver-trial.apk --clobber
          else
            gh release create "${{ github.ref_name }}" \
              taxo-rider-trial.apk \
              taxo-driver-trial.apk \
              --title "${{ github.ref_name }}" \
              --notes "التجريبيّتان من ${{ github.sha }} (\`.test\`). **وحزمتا صفحة التحميل تُرفقان هنا من Google Play بتوقيعه** (§٧٩)."
          fi
