# **البوّابةُ الثانية من الرفع** (`CLAUDE.md`, قرارُ المالك 2026-08-21):
# استنساخٌ نظيفٌ يشغّل المجموعةَ الكاملة والحرّاسَ وبناءَ الثلاثة.
#
# **ولا يخاطب الإنتاجَ إطلاقاً**: لا سرَّ إنتاجٍ في بيئته، ولا نداءَ إلى
# `stg-*`، ولا مفتاحَ خادم. وقيمُ البيئة هنا **مولَّدةٌ للتشغيل ويُرمى بها**،
# فليست أسراراً ولا تُقرأ كذلك — ولذلك تُكتب في الملفّ صراحةً بلا `secrets`.
#
# **ولا سرَّ في السجل**: لا `env` يُطبع، ولا `set -x` على أمرٍ يحمل قيمة.
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

# **إلغاءُ ما سبق على الفرع نفسِه**: أخضرُ لإيداعٍ تجاوزَته دفعةٌ أحدثُ لا يعني
# شيئاً، وانتظارُه ينفق دقائقَ على ما لن يُرفع.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: المجموعةُ الكاملة
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # **قيمٌ للتشغيل وحدَه** — ولا احتياطَ صامتٌ لسرّ: الملفُّ يُكتب كاملاً
      # فيقف الإقلاعُ إن نقص مفتاحٌ بدل أن يقع على افتراض.
      - name: بيئةُ التشغيل
        run: |
          python3 - <<'PY' > .env
          import secrets, base64
          fernet = base64.urlsafe_b64encode(secrets.token_bytes(32)).decode()
          print(f"""POSTGRES_USER=taxo
          POSTGRES_PASSWORD={secrets.token_urlsafe(24)}
          POSTGRES_DB=taxo
          DATABASE_URL=postgresql+asyncpg://taxo:x@db:5432/taxo
          REDIS_URL=redis://redis:6379/0
          JWT_SECRET={secrets.token_urlsafe(48)}
          CREDENTIALS_ENCRYPTION_KEY={fernet}
          ENVIRONMENT=test
          ACCESS_TOKEN_EXPIRE_MINUTES=15
          REFRESH_TOKEN_EXPIRE_DAYS=30
          CUSTOMER_APP_PORT=5176
          TELR_USE_MOCK=1
          WA_GATEWAY_KEY={secrets.token_urlsafe(24)}
          """.replace("          ", ""))
          PY
          # القيمةُ الحقيقيةُ لكلمة القاعدة تدخل عنوانَ الاتصال أيضاً
          pw=$(grep '^POSTGRES_PASSWORD=' .env | cut -d= -f2-)
          sed -i "s|postgresql+asyncpg://taxo:x@|postgresql+asyncpg://taxo:$pw@|" .env

      - name: بناءُ صورة الخلفية
        run: docker compose --env-file .env build backend

      # **القاعدةُ وRedis تُقامان هنا** — و`suite.sh` يمرّ بـ`--no-deps` عمداً
      # فلا يُقيمهما (لئلّا يُعيد تشغيلَ خدمةٍ صحيحةٍ على جهاز المطوّر).
      # **ولم تكن هذه الخطوةُ موجودةً قطّ**، فكانت المجموعةُ تعمل هنا **بلا
      # قاعدة**: ١١٧٦ خطأَ تهيئةٍ في التشغيل ٤١ — **ولم يُرَ ذلك لأن
      # `suite.sh` كان يخرج بصفرٍ حين يسقط** (أُصلح في الإيداع نفسِه).
      - name: القاعدةُ وRedis
        # **والاسمُ يُصرَّح هنا أيضاً**: `db` و`redis` بلا `env_file`، فـ`up`
        # يمرّ بدونه — **و`ps` يتحقّق من الملفِّ كلِّه** فيطلب `env_file` الخلفيةِ
        # ويقع على `.env.local` الافتراضيّ. (عطبٌ مقيسٌ في التشغيل ٤٢.)
        env:
          TAXO_ENV_FILE: .env
        run: |
          docker compose --env-file .env up -d db redis
          for i in $(seq 1 60); do
            ok=0
            for svc in db redis; do
              cid=$(docker compose --env-file .env ps -q "$svc")
              [ -n "$cid" ] || continue
              [ "$(docker inspect -f '{{.State.Health.Status}}' "$cid")" = healthy ] && ok=$((ok+1))
            done
            [ "$ok" = 2 ] && { echo "✓ القاعدةُ وRedis سليمتان بعد ${i}ث"; break; }
            [ "$i" = 60 ] && { echo "✗ لم تصحّا في ٦٠ث"; docker compose --env-file .env ps; exit 1; }
            sleep 1
          done

      # **البابُ الوحيدُ للمجموعة** — هو نفسُه محلياً وهنا، فلا تفترق بيئتان
      - name: المجموعةُ الكاملة
        run: TAXO_ENV_FILE=.env bash scripts/suite.sh

      # **الأثرُ يصل كاملاً** — و`tail` وحدَه لا يكفي: بألفٍ ومئةٍ وستةٍ وسبعين
      # خطأً تكون آخرُ ١٢٠ سطراً **قائمةَ الأسماء** لا الأثر، فيُقرأ «ما سقط»
      # ولا يُقرأ «لماذا». (وقع مقيساً في التشغيل ٤٣، فاضطُرّ قارئُه إلى إعادة
      # إنتاج العطب في حاويةٍ معزولةٍ ليعرف اسمَ الاستثناء.)
      #
      # **والرأسُ موضعُ الأثر**: أوّلُ خطأٍ يحمل التتبّعَ كاملاً وما بعده تَكرار.
      # **والعنوانُ يُقنَّع** التزاماً بـ«لا سرَّ في سجلّ CI» — وقِيس أن
      # SQLAlchemy تُقنّعه أصلاً، فهذا حزامٌ ثانٍ لا اعتمادٌ عليه.
      # **والقطعُ كالسقوط** (2026-08-24): `failure()` وحدَها **لا تشمل
      # `cancelled()`** — ومهلةُ الوظيفة تُنهيها «ملغاةً» لا «ساقطة». فمرّ
      # التشغيلُ ٤٨ ثلاثين دقيقةً ثم قُطع **بلا سطرِ تشخيصٍ واحد**، وهو
      # «الأثرُ المقطوع» في ثوبٍ ثالث.
      - name: النتيجةُ كاملةً عند السقوط
        if: failure() || cancelled()
        run: |
          if [ ! -f backend/.suite.out ]; then
            echo "لا ملفَّ نتيجةٍ — سقط قبل أن تبدأ المجموعة."
            exit 0
          fi
          # **شكلان لا واحد** — قِيس 2026-08-24 على مخرَجٍ حقيقيّ:
          #   ١) عنوانٌ `://مستخدم:كلمة@` — تُقنّعه SQLAlchemy أصلاً، وهذا حزامٌ ثانٍ
          #   ٢) `ConnectionParameters(user='…', password='…')` من تتبّع asyncpg
          #      — **وهذا هو الذي يتسرّب فعلاً**: ١٦ مرةً في مخرَجِ كلمةٍ خاطئة.
          # **ولم يقع تسرّبٌ في التشغيل ٤٣** لأن `tail` لم يبلغ الأثرَ أصلاً —
          # فالقطعُ الذي أخفى التشخيصَ منع التسرّبَ صدفةً. **وتوسيعُ الالتقاط
          # يفتحه**، فيُقنَّع قبل أن يُشحن لا بعده.
          mask() {
            sed -E -e 's#(://[^:/@]+):[^@]*@#\1:***@#g' \
                   -e "s#(password=)('[^']*'|\"[^\"]*\"|[^,)[:space:]]+)#\\1'***'#g" \
                   backend/.suite.out
          }
          echo "════════ أوّلُ ١٢٠ سطراً — وفيها الأثر ════════"
          mask | head -120
          echo
          echo "════════ آخرُ ٦٠ سطراً — الحصيلة ════════"
          mask | tail -60
          echo
          echo "════════ الأسبابُ المتمايزة وعددُ كلٍّ ════════"
          grep -oE '[A-Za-z_.]+(Error|Exception)' backend/.suite.out |
            sort | uniq -c | sort -rn | head -15

  # ════════════════════════════════════════════════════════════════════════
  # **الملفّاتُ الخمسة** (قرارُ المالك 2026-08-25): نُقل من `CLAUDE.md`
  # ما لا يحكم كلَّ قرار إلى أربعة ملفّاتٍ **مربوطةٍ بشروطٍ صريحة**.
  #
  # **وخطرُه واحد**: منقولٌ لا طريقَ إليه — وهو «بابٌ بلا زرّ» في ثوب
  # توثيق، **ولا يفشل به شيءٌ أبداً**. فالحارسُ يقيس الاتجاهين ويطبع الرقمين.
  # ══════════════════ الإيداعُ داخل الدفعة (قرارُ المالك 2026-08-30) ══════════
  #
  # **الثقبُ الذي سدّه هذا** (مقيسٌ 2026-08-30): Actions يُشغَّل على **رأس ما
  # دُفع** — **فإيداعٌ داخل دفعةٍ لا يُختبر أبداً**. و`76827fc` كان رابعَ خمسةٍ
  # في دفعة، **ولا تشغيلَ له قطّ**، فخلّف ستَّ حمرٍ عاشت يوماً كاملاً.
  # **والقاعدةُ تقول «لا يُودَع على مجموعةٍ حمراء»، والمجموعةُ عليه لم تُشغَّل**:
  # لم يقل البابُ «لا» — **لم يُسأل**.
  #
  # **وما يملكه وما لا يملكه، صراحةً**: يشغّل **المجموعةَ وحدَها** على كلِّ
  # إيداعٍ **عدا الرأس** (الرأسُ تغطّيه `backend` أصلاً). **ولا يشغّل الحرّاسَ
  # ولا بناءَ الثلاثة على الوسط** — تلك تُقاس على الرأس، **وثمنُها أربعةُ
  # أضعافٍ لا يشتري قدرَه**. وحارسٌ يوحي بتغطيةٍ لا يملكها أسوأُ من غيابه.
  #
  # **ولا يمنع الدفع**: هو تقريرٌ بعد الدفع كبقيّة CI — **والبوّابةُ الحقيقيّةُ
  # حمايةُ فرعٍ** تحتاج حساباً، وهي بندٌ مكتوبٌ في `STATE.md` بثمنه.
  batch:
    name: إيداعاتُ الدفعة
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      commits: ${{ steps.pick.outputs.commits }}
      dropped: ${{ steps.pick.outputs.dropped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: إيداعاتُ هذه الدفعة عدا رأسِها
        id: pick
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          empty=0000000000000000000000000000000000000000
          # **فرعٌ جديدٌ أو دفعةٌ قسرية**: `before` أصفارٌ أو ليس في الشجرة —
          # **فلا نطاقَ يُحسب**، والرأسُ وحدَه يُقاس ولا يُدَّعى غيرُ ذلك.
          if [ "$BEFORE" = "$empty" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "لا سلفَ معروفٌ لهذه الدفعة — الرأسُ وحدَه يُقاس"
            echo 'commits=[]' >> "$GITHUB_OUTPUT"
            echo 'dropped=0' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # **عدا الرأس**: `^$GITHUB_SHA^@` ليست حيلةً — الرأسُ له وظيفتُه
          all=$(git rev-list --reverse "$BEFORE..$GITHUB_SHA" | grep -v "^$GITHUB_SHA$" || true)
          total=$(printf '%s' "$all" | grep -c . || true)

          # **سقفٌ يُعلن ولا يُسكت عنه**: دفعةٌ من مئةٍ تُشعل مئةَ وظيفة.
          # **ولا سقفَ صامت** — ما سقط يُقال عدداً في السجلّ وفي الملخّص.
          keep=$(printf '%s' "$all" | tail -n 12)
          kept=$(printf '%s' "$keep" | grep -c . || true)
          dropped=$((total - kept))

          echo "في الدفعة $total إيداعاً عدا الرأس · يُقاس منها $kept · أُسقط $dropped"
          if [ "$dropped" -gt 0 ]; then
            echo "⚠ أُسقط $dropped إيداعاً أقدمَ من الاثني عشر الأخيرة — **ولم تُقَس**" >> "$GITHUB_STEP_SUMMARY"
          fi

          json=$(printf '%s' "$keep" | python3 -c 'import sys,json; print(json.dumps([l for l in sys.stdin.read().split() if l]))')
          echo "commits=$json" >> "$GITHUB_OUTPUT"
          echo "dropped=$dropped" >> "$GITHUB_OUTPUT"

  batch-suite:
    name: المجموعةُ عند ${{ matrix.commit }}
    needs: batch
    if: needs.batch.outputs.commits != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # **٢٥ محسوبةً لا موضوعة** (قرارُ المالك 2026-08-30): الأبطأُ مقيساً **١٦د
    # ٣٣ث** في تشغيل ‎#84، والأربعُ المتوازيةُ بين ١٦:١٨ و١٦:٣٣ — **فالتوازي
    # يكلّف دقيقةً ونصفاً لا أضعافاً**. و٢٥ تترك ثمانيَ دقائقَ فوق الأبطأ،
    # **وتقطع الجامدَ أبكرَ بخمسٍ فيُقرأ أسرع**. **و٤٥ تشتري احتمالاً وتبيع
    # خمسَ عشرةَ دقيقةً من الحصّة في كلِّ عالق** — والحصّةُ بندٌ يراقبه المالك.
    strategy:
      # **ولا `fail-fast`**: سقوطُ إيداعٍ لا يُخفي حالَ الذي بعده — والغرضُ
      # أن يُعرف **أيُّها** أحمر، لا أن يُعرف أنّ فيها أحمر.
      fail-fast: false
      matrix:
        commit: ${{ fromJSON(needs.batch.outputs.commits) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.commit }}
          fetch-depth: 1

      - name: بيئةُ التشغيل
        run: |
          python3 - <<'PY' > .env
          import secrets, base64
          fernet = base64.urlsafe_b64encode(secrets.token_bytes(32)).decode()
          print(f"""POSTGRES_USER=taxo
          POSTGRES_PASSWORD={secrets.token_urlsafe(24)}
          POSTGRES_DB=taxo
          DATABASE_URL=postgresql+asyncpg://taxo:x@db:5432/taxo
          REDIS_URL=redis://redis:6379/0
          JWT_SECRET={secrets.token_urlsafe(48)}
          CREDENTIALS_ENCRYPTION_KEY={fernet}
          ENVIRONMENT=test
          ACCESS_TOKEN_EXPIRE_MINUTES=15
          REFRESH_TOKEN_EXPIRE_DAYS=30
          CUSTOMER_APP_PORT=5176
          TELR_USE_MOCK=1
          WA_GATEWAY_KEY={secrets.token_urlsafe(24)}
          """.replace("          ", ""))
          PY
          pw=$(grep '^POSTGRES_PASSWORD=' .env | cut -d= -f2-)
          sed -i "s|postgresql+asyncpg://taxo:x@|postgresql+asyncpg://taxo:$pw@|" .env

      - name: بناءُ صورة الخلفية
        run: docker compose --env-file .env build backend

      - name: القاعدةُ وRedis
        env:
          TAXO_ENV_FILE: .env
        run: |
          docker compose --env-file .env up -d db redis
          for i in $(seq 1 60); do
            ok=0
            for svc in db redis; do
              cid=$(docker compose --env-file .env ps -q "$svc")
              [ -n "$cid" ] || continue
              [ "$(docker inspect -f '{{.State.Health.Status}}' "$cid")" = healthy ] && ok=$((ok+1))
            done
            [ "$ok" = 2 ] && break
            [ "$i" = 60 ] && { echo "✗ لم تصحّا في ٦٠ث"; exit 1; }
            sleep 1
          done

      - name: المجموعةُ الكاملة
        run: TAXO_ENV_FILE=.env bash scripts/suite.sh

      # **الأثرُ يذهب إلى السجلِّ لا إلى الملخّص وحدَه** (صُحِّح 2026-08-30
      # ساعةَ بنائه): كان يُكتب في `GITHUB_STEP_SUMMARY` فقط، **ولا يقرأ الـAPI
      # الملخّصات** — فقيل «أيُّ إيداعٍ أحمر» ولم يُقَل **لماذا**، ولا سبيلَ إلى
      # معرفته إلا بفتح الصفحة بيد. **وبابٌ يقول نصفَ الخبر يُقرأ خبراً كاملاً.**
      #
      # **ووظيفةُ الرأس تطبع النتيجةَ كاملةً في سجلّها منذ أُصلحت** — فهذه
      # تفعل مثلَها، **ولا نصفُ نسخةٍ من قاعدةٍ مكتوبة**.
      - name: أثرُ السقوط
        if: failure() || cancelled()
        run: |
          echo "### ✗ ${{ matrix.commit }}" >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(FAILED|ERROR)' backend/.suite.out | head -40 >> "$GITHUB_STEP_SUMMARY" || true
          echo "══════════ النتيجةُ كاملةً عند ${{ matrix.commit }} ══════════"
          cat backend/.suite.out || echo "لا ملفَّ نتيجة — سقط قبل أن يُكتب"

  docs:
    name: الملفّاتُ الخمسة
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tools/check-docs.mjs

  frontends:
    name: الحرّاسُ وبناءُ الثلاثة
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: customer-app
            target: https://api.tajora.ly
          - app: driver-app
            target: https://api.tajora.ly
          # **هدفُ البناء يتبع هدفَ النشر** (قرارُ المالك 2026-08-30).
          # **وكان `https://stg-api.tajora.ly`** — بقيّةٌ ممّا قبل قلب
          # الأسماء، **وهدفٌ لا يقصده إلا هذه المصفوفة**: قِيس أن اللوحةَ
          # الحيّةَ على `stg-admin.tajora.ly` تنادي `api.tajora.ly` (مقروءاً
          # من حزمتها لا من ظنّ)، وأن `deploy.sh` يبني الثلاثةَ بـ`FRONT_API`
          # واحدٍ هو `api.tajora.ly`.
          #
          # **وخُضرةٌ على هدفٍ لا يُشحن تقول «تُبنى على هدفٍ ما»** لا «تُبنى
          # على هدفها» — و`check:target` يبقى أخضرَ صادقاً لأنه يقيس المُعلَنَ
          # مقابل المبنيّ، **والفجوةُ بين مُعلَنِ CI ومُعلَنِ النشر خارج نطاقه**.
          - app: admin-panel
            target: https://api.tajora.ly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - run: npm ci
        working-directory: ${{ matrix.app }}

      # **بهدفٍ مُصرَّحٍ به**: `check:target` يرفض بناءً بلا هدف، وهو المقصود —
      # حزمةٌ بلا هدفٍ هي التي تقف على «الشبكة ضعيفة» في يدِ إنسان.
      #
      # و`check:served` يمرّ هنا بلا خادم: يسقط على **الاختلاف** لا على الغياب،
      # ويقول «لم يُقس» صراحةً بدل أن يسكت.
      - run: npm run build
        working-directory: ${{ matrix.app }}
        env:
          VITE_API_BASE_URL: ${{ matrix.target }}

  # ═══════════════════════════════════════════════════════════════════════
  # **الحزمُ تُبنى هنا وتُنشر أثراً — لا من جهاز أحد** (قرارُ المالك 2026-08-21)
  #
  # **والعلّةُ أن البوّابةَ الرابعة تقول «الخادمُ يسحب نفسَ ما خضّره CI»** —
  # وكانت الحزمةُ تُبنى على جهاز المالك **ولا شيءَ يربطها بCI**، فالجملةُ
  # صادقةٌ في الكود وكاذبةٌ في الحزمة. والبديلُ المرفوض إدخالُ الثنائيات في
  # git: **يثقل التاريخَ أبداً بما لا يخزّنه git أصلاً**.
  #
  # **وعلى الأوسمة وحدَها**: بناءُ أندرويد بطيء، وإصدارٌ لكلِّ دفعةٍ إنفاقٌ بلا
  # قارئ. **والوسمُ هو ما يسحبه الخادم**، فيصير ما تخدمه الصفحةُ = ما بناه CI
  # = وسمُه — **ثلاثةٌ مقيسةٌ لا مكتوبة**.
  #
  # **والتوقيعُ تنقيحيٌّ حتى يصل مفتاحُ النشر** (المواصفة §18.1) — يُقال ولا
  # يُسكت عنه: أولُ حزمةٍ بمفتاح الإصدار **لا تُحدِّث المثبَّت**.
  packages:
    name: الحزمُ وإصدارُها
    needs: [backend, frontends]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # **التاريخُ كاملاً**: `versionCode` يُشتقّ من عدد الإيداعات،
          # **واستنساخٌ ضحلٌ يجعله رقماً كاذباً** — والبناءُ يقف عمداً بلا تاريخ
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # **المفتاحُ يُفكُّ إلى ملفٍّ مؤقّتٍ خارج الشجرة** — لا في المستودع ولا
      # في مجلَّدٍ يُرفع أثراً. ويعيش عمرَ المجرى وحدَه.
      - name: مفتاحُ التوقيع
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          # **وغيابُ السرِّ يوقف باسمه** — لا يقع على مفتاح تصحيحٍ صامتاً
          [ -n "${KS_B64:-}" ] || { echo "✗ السرُّ ANDROID_KEYSTORE_B64 غيرُ مضبوط — لا توقيعَ ولا حزمة."; exit 1; }
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/taxo-release.jks"
          # **يُقاس أنه مخزنٌ لا نصٌّ فارغ** — و`base64` لا يشكو من مدخلٍ خاطئ
          [ -s "$RUNNER_TEMP/taxo-release.jks" ] || { echo "✗ المخزنُ فارغٌ بعد فكِّ الترميز."; exit 1; }
          echo "  ✓ المخزنُ فُكَّ ($(stat -c%s "$RUNNER_TEMP/taxo-release.jks") بايت)"

      # **أربعُ حزمٍ لا حزمتان** (`channels.json`، قرارُ المالك 2026-08-26):
      # قناتان × تطبيقان. **والقناةُ تُصرَّح ولا تُفترض** — `TAXO_CHANNEL` غيرُ
      # مضبوطٍ **يوقف** `capacitor.config.ts` باسمه، وهو ما يجعل «نسخةً عامّةً
      # بُنيت على عنوان جهاز مطوّر» مستحيلةً لا مستبعَدة.
      #
      # **ونكهةُ gradle تُقرأ من الجدول لا تُكتب هنا**: `test` محجوزٌ في AGP
      # فنكهتُها `trial` — **واسمان يفترقان في ملفَّين هو ما يمنعه الجدول**.
      # **إعدادُ Firebase يُفكُّ إلى مكانه في التطبيقين** — وهو مُتجاهَلٌ في
      # git بحقّ (يحمل مفاتيحَ عميلٍ ومعرّفاتِ مشروع)، **فبيتُه سرُّ المستودع**.
      #
      # **ولمَ صار خطوةً**: بلا هذا كان `google-services.json` غائباً في CI
      # **فتُبنى الحزمُ المنشورةُ بلا إشعاراتٍ وبناؤها أخضر** — قِيس في
      # `v0.2.0`: لا `project_id` ولا رقمَ مشروعٍ داخل الحزمتين.
      - name: إعدادُ Firebase للتطبيقين
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_B64 }}
        run: |
          set -euo pipefail
          # **وغيابُ السرِّ يوقف باسمه** — لا يقع على بناءٍ بلا إشعاراتٍ صامتاً
          [ -n "${GS_B64:-}" ] || { echo "SECRET_MISSING GOOGLE_SERVICES_B64"; exit 1; }
          for app in customer-app driver-app; do
            printf '%s' "$GS_B64" | base64 -d > "$app/android/app/google-services.json"
            # **يُقاس أنه JSON بعملاءَ لا نصٌّ فارغ** — و`base64` لا يشكو من مدخلٍ خاطئ
            python3 - "$app/android/app/google-services.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1], encoding="utf-8"))
          clients = [c["client_info"]["android_client_info"]["package_name"] for c in d["client"]]
          print(f"  ✓ {sys.argv[1]}: {d['project_info']['project_id']} · {len(clients)} عملاء")
          need = {"ly.tajora.rider", "ly.tajora.driver", "ly.tajora.rider.test", "ly.tajora.driver.test"}
          missing = need - set(clients)
          if missing:
              raise SystemExit(f"✗ عملاءُ ناقصون في السرّ: {sorted(missing)}")
          PY
          done

      - name: بناءُ الأربع
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/taxo-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for v in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            # **يُسمّى الناقصُ ولا تُطبع قيمةُ الموجود**
            [ -n "$(eval echo \"\$$v\")" ] || { echo "SECRET_MISSING $v"; exit 1; }
          done
          for app in customer-app driver-app; do
            ( cd "$app" && npm ci --silent )
            for channel in public test; do
              flavor="$(node -e "import('./tools/channels.mjs').then(m=>process.stdout.write(m.TABLE.channels['$channel'].gradleFlavor))")"
              task="assemble$(printf '%s' "$flavor" | sed 's/^./\U&/')Release"
              echo "---- $app | channel=$channel | flavor=$flavor | $task ----"
              # **بابٌ واحدٌ يشتقّ العنوانَ من الجدول** — لا عنوانَ مكتوباً هنا
              TAXO_CHANNEL="$channel" node tools/build-channel.mjs "$app"
              ( cd "$app" && TAXO_CHANNEL="$channel" npx cap sync android )
              # **`sh gradlew` لا `./gradlew`** — وقع مقيساً (خروج ١٢٦):
              # صلاحيةُ التنفيذ لا يحفظها ويندوز، فالملفُّ يُدفع بلا `+x`.
              ( cd "$app/android" && TAXO_CHANNEL="$channel" sh gradlew "$task" --no-daemon -q )
            done
          done

      # **التوقيعُ يُقرأ من الحزمة لا من سجلِّ البناء** (خطوةُ الصفر): سطرٌ
      # يقول «وقّعتُ» ليس توقيعاً — و`apksigner` يقرأ الشهادةَ من داخل الملفّ.
      # **والأربعُ تُقاس لا واحدة**: `build.gradle` ملفّان منفصلان، وتطابقُ
      # أحدهما لا يشهد للآخر (الشكلُ الثامن).
      - name: التوقيعُ مقروءاً من الأربع
        run: |
          set -euo pipefail
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -1)"
          seen=0
          for app in customer-app driver-app; do
            for flavor in public trial; do
              f="$app/android/app/build/outputs/apk/$flavor/release/app-$flavor-release.apk"
              [ -f "$f" ] || { echo "APK_MISSING $f"; exit 1; }
              echo "---- $f ----"
              "$APKSIGNER" verify --print-certs "$f" | grep -Ei 'SHA-256 digest|Signer #1 certificate DN'
              seen=$((seen+1))
            done
          done
          # **العددُ يُقاس** — ثلاثةٌ من أربعٍ تمرّ صامتةً لولا هذا السطر
          [ "$seen" -eq 4 ] || { echo "SIGNED_COUNT $seen of 4"; exit 1; }

      - name: البيانُ ومعه الإيداع
        run: node tools/apk-manifest.mjs

      - name: الإصدارُ وأثرُه
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # **الأربعُ تُرفَق، والعامّتان وحدَهما تنزلان الصفحة**: التجريبيّةُ
          # تخاطب جهازَ مطوّر، فمكانُها الإصدارُ لمن يقصدها لا صفحةٌ عامّة.
          cp customer-app/android/app/build/outputs/apk/trial/release/app-trial-release.apk taxo-rider-trial.apk
          cp driver-app/android/app/build/outputs/apk/trial/release/app-trial-release.apk  taxo-driver-trial.apk
          gh release create "${{ github.ref_name }}" \
            landing/downloads/taxo-rider.apk \
            landing/downloads/taxo-driver.apk \
            landing/downloads/manifest.json \
            taxo-rider-trial.apk \
            taxo-driver-trial.apk \
            --title "${{ github.ref_name }}" \
            --notes "أربعُ حزمٍ من ${{ github.sha }} — **موقَّعةٌ بمفتاح الإصدار** (§18.1). العامّتان على صفحة التحميل، والتجريبيّتان هنا."
