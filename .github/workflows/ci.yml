# **البوّابةُ الثانية من الرفع** (`CLAUDE.md`, قرارُ المالك 2026-08-21):
# استنساخٌ نظيفٌ يشغّل المجموعةَ الكاملة والحرّاسَ وبناءَ الثلاثة.
#
# **ولا يخاطب الإنتاجَ إطلاقاً**: لا سرَّ إنتاجٍ في بيئته، ولا نداءَ إلى
# `stg-*`، ولا مفتاحَ خادم. وقيمُ البيئة هنا **مولَّدةٌ للتشغيل ويُرمى بها**،
# فليست أسراراً ولا تُقرأ كذلك — ولذلك تُكتب في الملفّ صراحةً بلا `secrets`.
#
# **ولا سرَّ في السجل**: لا `env` يُطبع، ولا `set -x` على أمرٍ يحمل قيمة.
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

# **إلغاءُ ما سبق على الفرع نفسِه**: أخضرُ لإيداعٍ تجاوزَته دفعةٌ أحدثُ لا يعني
# شيئاً، وانتظارُه ينفق دقائقَ على ما لن يُرفع.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: المجموعةُ الكاملة
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # **قيمٌ للتشغيل وحدَه** — ولا احتياطَ صامتٌ لسرّ: الملفُّ يُكتب كاملاً
      # فيقف الإقلاعُ إن نقص مفتاحٌ بدل أن يقع على افتراض.
      - name: بيئةُ التشغيل
        run: |
          python3 - <<'PY' > .env
          import secrets, base64
          fernet = base64.urlsafe_b64encode(secrets.token_bytes(32)).decode()
          print(f"""POSTGRES_USER=taxo
          POSTGRES_PASSWORD={secrets.token_urlsafe(24)}
          POSTGRES_DB=taxo
          DATABASE_URL=postgresql+asyncpg://taxo:x@db:5432/taxo
          REDIS_URL=redis://redis:6379/0
          JWT_SECRET={secrets.token_urlsafe(48)}
          CREDENTIALS_ENCRYPTION_KEY={fernet}
          ENVIRONMENT=test
          ACCESS_TOKEN_EXPIRE_MINUTES=15
          REFRESH_TOKEN_EXPIRE_DAYS=30
          CUSTOMER_APP_PORT=5176
          TELR_USE_MOCK=1
          WA_GATEWAY_KEY={secrets.token_urlsafe(24)}
          """.replace("          ", ""))
          PY
          # القيمةُ الحقيقيةُ لكلمة القاعدة تدخل عنوانَ الاتصال أيضاً
          pw=$(grep '^POSTGRES_PASSWORD=' .env | cut -d= -f2-)
          sed -i "s|postgresql+asyncpg://taxo:x@|postgresql+asyncpg://taxo:$pw@|" .env

      - name: بناءُ صورة الخلفية
        run: docker compose --env-file .env build backend

      # **القاعدةُ وRedis تُقامان هنا** — و`suite.sh` يمرّ بـ`--no-deps` عمداً
      # فلا يُقيمهما (لئلّا يُعيد تشغيلَ خدمةٍ صحيحةٍ على جهاز المطوّر).
      # **ولم تكن هذه الخطوةُ موجودةً قطّ**، فكانت المجموعةُ تعمل هنا **بلا
      # قاعدة**: ١١٧٦ خطأَ تهيئةٍ في التشغيل ٤١ — **ولم يُرَ ذلك لأن
      # `suite.sh` كان يخرج بصفرٍ حين يسقط** (أُصلح في الإيداع نفسِه).
      - name: القاعدةُ وRedis
        # **والاسمُ يُصرَّح هنا أيضاً**: `db` و`redis` بلا `env_file`، فـ`up`
        # يمرّ بدونه — **و`ps` يتحقّق من الملفِّ كلِّه** فيطلب `env_file` الخلفيةِ
        # ويقع على `.env.local` الافتراضيّ. (عطبٌ مقيسٌ في التشغيل ٤٢.)
        env:
          TAXO_ENV_FILE: .env
        run: |
          docker compose --env-file .env up -d db redis
          for i in $(seq 1 60); do
            ok=0
            for svc in db redis; do
              cid=$(docker compose --env-file .env ps -q "$svc")
              [ -n "$cid" ] || continue
              [ "$(docker inspect -f '{{.State.Health.Status}}' "$cid")" = healthy ] && ok=$((ok+1))
            done
            [ "$ok" = 2 ] && { echo "✓ القاعدةُ وRedis سليمتان بعد ${i}ث"; break; }
            [ "$i" = 60 ] && { echo "✗ لم تصحّا في ٦٠ث"; docker compose --env-file .env ps; exit 1; }
            sleep 1
          done

      # **البابُ الوحيدُ للمجموعة** — هو نفسُه محلياً وهنا، فلا تفترق بيئتان
      - name: المجموعةُ الكاملة
        run: TAXO_ENV_FILE=.env bash scripts/suite.sh

      # **الأثرُ يصل كاملاً** — و`tail` وحدَه لا يكفي: بألفٍ ومئةٍ وستةٍ وسبعين
      # خطأً تكون آخرُ ١٢٠ سطراً **قائمةَ الأسماء** لا الأثر، فيُقرأ «ما سقط»
      # ولا يُقرأ «لماذا». (وقع مقيساً في التشغيل ٤٣، فاضطُرّ قارئُه إلى إعادة
      # إنتاج العطب في حاويةٍ معزولةٍ ليعرف اسمَ الاستثناء.)
      #
      # **والرأسُ موضعُ الأثر**: أوّلُ خطأٍ يحمل التتبّعَ كاملاً وما بعده تَكرار.
      # **والعنوانُ يُقنَّع** التزاماً بـ«لا سرَّ في سجلّ CI» — وقِيس أن
      # SQLAlchemy تُقنّعه أصلاً، فهذا حزامٌ ثانٍ لا اعتمادٌ عليه.
      # **والقطعُ كالسقوط** (2026-08-24): `failure()` وحدَها **لا تشمل
      # `cancelled()`** — ومهلةُ الوظيفة تُنهيها «ملغاةً» لا «ساقطة». فمرّ
      # التشغيلُ ٤٨ ثلاثين دقيقةً ثم قُطع **بلا سطرِ تشخيصٍ واحد**، وهو
      # «الأثرُ المقطوع» في ثوبٍ ثالث.
      - name: النتيجةُ كاملةً عند السقوط
        if: failure() || cancelled()
        run: |
          if [ ! -f backend/.suite.out ]; then
            echo "لا ملفَّ نتيجةٍ — سقط قبل أن تبدأ المجموعة."
            exit 0
          fi
          # **شكلان لا واحد** — قِيس 2026-08-24 على مخرَجٍ حقيقيّ:
          #   ١) عنوانٌ `://مستخدم:كلمة@` — تُقنّعه SQLAlchemy أصلاً، وهذا حزامٌ ثانٍ
          #   ٢) `ConnectionParameters(user='…', password='…')` من تتبّع asyncpg
          #      — **وهذا هو الذي يتسرّب فعلاً**: ١٦ مرةً في مخرَجِ كلمةٍ خاطئة.
          # **ولم يقع تسرّبٌ في التشغيل ٤٣** لأن `tail` لم يبلغ الأثرَ أصلاً —
          # فالقطعُ الذي أخفى التشخيصَ منع التسرّبَ صدفةً. **وتوسيعُ الالتقاط
          # يفتحه**، فيُقنَّع قبل أن يُشحن لا بعده.
          mask() {
            sed -E -e 's#(://[^:/@]+):[^@]*@#\1:***@#g' \
                   -e "s#(password=)('[^']*'|\"[^\"]*\"|[^,)[:space:]]+)#\\1'***'#g" \
                   backend/.suite.out
          }
          echo "════════ أوّلُ ١٢٠ سطراً — وفيها الأثر ════════"
          mask | head -120
          echo
          echo "════════ آخرُ ٦٠ سطراً — الحصيلة ════════"
          mask | tail -60
          echo
          echo "════════ الأسبابُ المتمايزة وعددُ كلٍّ ════════"
          grep -oE '[A-Za-z_.]+(Error|Exception)' backend/.suite.out |
            sort | uniq -c | sort -rn | head -15

  frontends:
    name: الحرّاسُ وبناءُ الثلاثة
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: customer-app
            target: https://api.tajora.ly
          - app: driver-app
            target: https://api.tajora.ly
          - app: admin-panel
            target: https://stg-api.tajora.ly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - run: npm ci
        working-directory: ${{ matrix.app }}

      # **بهدفٍ مُصرَّحٍ به**: `check:target` يرفض بناءً بلا هدف، وهو المقصود —
      # حزمةٌ بلا هدفٍ هي التي تقف على «الشبكة ضعيفة» في يدِ إنسان.
      #
      # و`check:served` يمرّ هنا بلا خادم: يسقط على **الاختلاف** لا على الغياب،
      # ويقول «لم يُقس» صراحةً بدل أن يسكت.
      - run: npm run build
        working-directory: ${{ matrix.app }}
        env:
          VITE_API_BASE_URL: ${{ matrix.target }}

  # ═══════════════════════════════════════════════════════════════════════
  # **الحزمُ تُبنى هنا وتُنشر أثراً — لا من جهاز أحد** (قرارُ المالك 2026-08-21)
  #
  # **والعلّةُ أن البوّابةَ الرابعة تقول «الخادمُ يسحب نفسَ ما خضّره CI»** —
  # وكانت الحزمةُ تُبنى على جهاز المالك **ولا شيءَ يربطها بCI**، فالجملةُ
  # صادقةٌ في الكود وكاذبةٌ في الحزمة. والبديلُ المرفوض إدخالُ الثنائيات في
  # git: **يثقل التاريخَ أبداً بما لا يخزّنه git أصلاً**.
  #
  # **وعلى الأوسمة وحدَها**: بناءُ أندرويد بطيء، وإصدارٌ لكلِّ دفعةٍ إنفاقٌ بلا
  # قارئ. **والوسمُ هو ما يسحبه الخادم**، فيصير ما تخدمه الصفحةُ = ما بناه CI
  # = وسمُه — **ثلاثةٌ مقيسةٌ لا مكتوبة**.
  #
  # **والتوقيعُ تنقيحيٌّ حتى يصل مفتاحُ النشر** (المواصفة §18.1) — يُقال ولا
  # يُسكت عنه: أولُ حزمةٍ بمفتاح الإصدار **لا تُحدِّث المثبَّت**.
  packages:
    name: الحزمُ وإصدارُها
    needs: [backend, frontends]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # **التاريخُ كاملاً**: `versionCode` يُشتقّ من عدد الإيداعات،
          # **واستنساخٌ ضحلٌ يجعله رقماً كاذباً** — والبناءُ يقف عمداً بلا تاريخ
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: بناءُ الحزمتين
        run: |
          set -euo pipefail
          for app in customer-app driver-app; do
            ( cd "$app" && npm ci --silent )
            ( cd "$app" && VITE_API_BASE_URL=https://api.tajora.ly npm run build )
            ( cd "$app" && npx cap sync android )
            # **`sh gradlew` لا `./gradlew`** — وهذا وقع مقيساً (خروج ١٢٦):
            # صلاحيةُ التنفيذ لا يحفظها ويندوز، فالملفُّ يُدفع بلا `+x`.
            # وقد صُحّح الوضعُ في git (`--chmod=+x`)، **وهذا السطرُ يبقى**:
            # استنساخٌ على ويندوزَ يعيد إسقاطَ الصلاحية، ورقمُ الخروج ١٢٦ لا
            # يقول «غيرُ قابلٍ للتنفيذ» لمن يقرأه أولَ مرة.
            ( cd "$app/android" && sh gradlew assembleDebug --no-daemon -q )
          done

      - name: البيانُ ومعه الإيداع
        run: node tools/apk-manifest.mjs

      - name: الإصدارُ وأثرُه
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ github.ref_name }}"             landing/downloads/taxo-rider.apk             landing/downloads/taxo-driver.apk             landing/downloads/manifest.json             --title "${{ github.ref_name }}"             --notes "حزمتان مبنيّتان من ${{ github.sha }} — توقيعُ تنقيحٍ حتى يصل مفتاحُ النشر (§18.1)."
