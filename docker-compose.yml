# اسم مشروع مستقل حتى لا يتداخل مع أي stack آخر باسم "taxo" على نفس الجهاز
name: taxo-app

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: taxo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taxo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taxo}
      POSTGRES_DB: ${POSTGRES_DB:-taxo}
    ports:
      - "5432:5432"
    volumes:
      - taxo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taxo} -d ${POSTGRES_DB:-taxo}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: taxo-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - taxo_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: taxo-backend
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      # داخل الشبكة الداخلية أسماء المضيفين هي أسماء الخدمات
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-taxo}:${POSTGRES_PASSWORD:-taxo}@db:5432/${POSTGRES_DB:-taxo}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # 8000 مشغول بمشروع آخر على هذا الجهاز — الواجهة الخارجية 8001
      - "8001:8000"
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # عامل Celery: ما يحتمل التأجيل وحده (انتهاء الاشتراكات — SPEC القسم 8).
  # توزيع الرحلات ليس هنا: يعيش في عملية التطبيق لأن الراكب ينتظر على الشاشة.
  worker:
    build:
      context: ./backend
    container_name: taxo-worker
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-taxo}:${POSTGRES_PASSWORD:-taxo}@db:5432/${POSTGRES_DB:-taxo}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.tasks.celery_app:celery_app worker --loglevel=info
    # فحص الصورة يستعلم منفذ الـ API، وهذه العملية لا تفتح منفذاً — فيبقى
    # «unhealthy» أبداً بلا معنى. حياةُ العامل تُقرأ من سجلّه لا من HTTP
    healthcheck:
      disable: true

  # المجدول — **نسخة واحدة لا غير**: نسختان تُطلقان كل دورة مرتين
  beat:
    build:
      context: ./backend
    container_name: taxo-beat
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-taxo}:${POSTGRES_PASSWORD:-taxo}@db:5432/${POSTGRES_DB:-taxo}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    # ملف الجدول في /tmp: المجلد مربوط بالمصدر ولا يُكتب فيه أثرُ تشغيل
    command: >
      celery -A app.tasks.celery_app:celery_app beat --loglevel=info
      --schedule=/tmp/celerybeat-schedule
    healthcheck:
      disable: true

volumes:
  taxo_pgdata:
  taxo_redisdata:
