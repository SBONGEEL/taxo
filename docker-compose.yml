# اسم مشروع مستقل حتى لا يتداخل مع أي stack آخر باسم "taxo" على نفس الجهاز
name: taxo-app

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: taxo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taxo}
      # **ولا احتياطَ صامتٌ لسرّ** (قرارُ المالك 2026-08-20): كانت
      #     ${POSTGRES_PASSWORD:-taxo}
      # فبيئةٌ ناقصةٌ في الإنتاج **تُقلع بكلمةِ مرورٍ معروفةٍ ولا يفشل شيء** — وهو
      # أخطرُ من سرٍّ مكتوب، لأن المكتوبَ يُرى والاحتياطَ لا أثرَ له. والآن
      # `${POSTGRES_PASSWORD:?...}`: **يرفض compose الإقلاعَ** ويقول أيُّ متغيّرٍ نقص.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD مطلوبٌ في .env — لا احتياطَ لسرّ}
      POSTGRES_DB: ${POSTGRES_DB:-taxo}
    ports:
      - "5432:5432"
    volumes:
      - taxo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taxo} -d ${POSTGRES_DB:-taxo}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: taxo-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - taxo_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: taxo-backend
    restart: unless-stopped
    env_file:
      # **اسمُ ملفِّ البيئة يُصرَّح ولا يُثبَّت** (2026-08-21): `suite.sh` كان
      # يمرّر `--env-file` وحدَه، **وهذه السطورُ تُثبِّت `.env.local` رغمه** —
      # فيقف compose على استنساخٍ نظيفٍ لا ملفَّ فيه، وهو ما أحمرَّ به CI.
      # **وتصريحٌ نصفُه ليس تصريحاً**: ما لم يحكم الاسمُ الموضعين معاً بقي
      # الأولُ يَعِد بما ينقضه الثاني.
      - ${TAXO_ENV_FILE:-.env.local}
    environment:
      # داخل الشبكة الداخلية أسماء المضيفين هي أسماء الخدمات
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-taxo}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD مطلوبٌ في .env — لا احتياطَ لسرّ}@db:5432/${POSTGRES_DB:-taxo}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # 8000 مشغول بمشروع آخر على هذا الجهاز — الواجهة الخارجية 8001
      - "8001:8000"
    volumes:
      - ./backend:/app
      # ملفات العقود التي يقرأها `scripts.seed` مرةً واحدة (حساب خدمة FCM).
      # للقراءة فقط، ومصدرُها الرسمي بعد البذر هو `provider_credentials`
      # مشفَّراً لا القرص (SPEC القسم 14)
      - ./secrets:/app/secrets:ro
      # **شروطُ قالب الرمز — ملفٌ واحدٌ يقرؤه اثنان** (قرارُ المالك 2026-08-19).
      # الخلفيةُ ترفض به الحفظَ في اللوحة، والبوابةُ ترفض به الخروجَ على السلك.
      # ونسختان تفترقان أوّلَ تعديل، فيُقبل في اللوحة نصٌّ ترفضه البوابةُ صامتةً.
      # وموضعُه الأصليُّ عند البوابة لأن الشرطَ صفةُ السلك — وهذا ربطٌ للقراءة
      - ./whatsapp-gateway/otp-template-rules.json:/app/otp_template_rules.json:ro
      # مستندات الكباتن (المرحلة 9-ب). حجمٌ مسمّى **فوق** الربط بالمصدر:
      # بغيره تُكتب المرفوعات في مجلد المستودع على القرص المضيف فتدخل Git
      # وتذهب مع كل استنساخ. ولا تُخدَم من هنا بخادم ملفاتٍ ساكن: القراءة
      # تمر بمسارٍ يتحقق من الملكية (SPEC القسم 14)
      - taxo_documents:/app/var/documents
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # بوابةُ واتساب الذاتية (Baileys) — **لا `ports:` هنا بقصد**.
  #
  # الخدمةُ تُرى من شبكة المشروع الداخلية وحدها، فلا تصلها واجهةٌ ولا متصفّح:
  # الخلفيةُ وحدها تكلّمها، ومعها مفتاحٌ مشترك. وحارسان لا واحد — «لا منفذ»
  # شرطُ نشرٍ يُنقض بسطرٍ في ملفٍ آخر، والمفتاحُ شرطٌ في الكود.
  #
  # **وحالةُ المصادقة على حجمٍ مسمّى لا في الحاوية**: إعادةُ بناءِ الصورة أو
  # إعادةُ تشغيلها لا تُفقد الجلسة — وبغيره يحتاج كلُّ نشرٍ هاتفاً يمسح رمزاً.
  # وهو **مفاتيحُ حسابٍ كاملة**، فيدخل النسخَ الاحتياطي مشفّراً كمفتاح Fernet.
  whatsapp-gateway:
    build:
      context: ./whatsapp-gateway
    container_name: taxo-whatsapp-gateway
    restart: unless-stopped
    # **المفتاحُ من `.env.local` كبقية أسرار البنية** (DB وRedis وFernet):
    # compose يفسّر `${VAR}` من `.env` وحدَه لا من `.env.local`، فالإحالةُ
    # بالتفسير كانت تُمرّر فراغاً والبوابةُ ترفض الإقلاع بحقّ.
    # **ولا `:?` في التفسير**: تلك تجعل كلَّ أمر compose يرفض — حتى
    # `run backend` لاختبارٍ لا علاقةَ له بواتساب. والحارسُ في الخدمة نفسِها
    env_file:
      # **اسمُ ملفِّ البيئة يُصرَّح ولا يُثبَّت** (2026-08-21): `suite.sh` كان
      # يمرّر `--env-file` وحدَه، **وهذه السطورُ تُثبِّت `.env.local` رغمه** —
      # فيقف compose على استنساخٍ نظيفٍ لا ملفَّ فيه، وهو ما أحمرَّ به CI.
      # **وتصريحٌ نصفُه ليس تصريحاً**: ما لم يحكم الاسمُ الموضعين معاً بقي
      # الأولُ يَعِد بما ينقضه الثاني.
      - ${TAXO_ENV_FILE:-.env.local}
    environment:
      WA_PORT: "8080"
      WA_AUTH_DIR: /data/auth
      # مستوى سجلّ Baileys نفسِها — `warn` افتراضاً في `session.js`،
      # و`trace` يطبع كلَّ إطارٍ داخلٍ وخارجٍ (للتشخيص وحدَه، صاخبٌ جداً)
      WA_BAILEYS_LOG_LEVEL: warn
    # **مُحلِّلا أسماءٍ ثابتان** — والسببُ مقيسٌ لا احترازيّ: مُحلِّلُ دوكر
    # الداخليّ كان يفشل متقطّعاً على `web.whatsapp.com`
    # (`getaddrinfo ENOTFOUND`)، فيسقط مقبسُ Baileys ويعود، **والرسالةُ التي
    # تُسلَّم إليه في تلك اللحظة تُقبل ويُعاد لها مرجعٌ ولا تُنقل أبداً**.
    #
    # وهو أسوأُ شكلٍ للعطب: نظامُنا يقرأ «أُرسلت» والهاتفُ لا يرنّ، والجلسةُ
    # تُقرأ `linked` لحظةَ السؤال لأنها عادت قبل ثانية. وقياسُه كان في `since`
    # الذي تبدّل من 07:18 إلى 07:53 بين قراءتين لا يفصل بينهما عملٌ عليها.
    #
    # **ولا يُعالج بإعادة محاولةٍ أذكى**: إعادةُ المحاولة تصلح ما يفشل ظاهراً،
    # وهذا **ينجح ظاهراً** — فالعلاجُ عند جذره: اسمٌ يُحلّ دائماً.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - taxo_wa_auth:/data

  # عامل Celery: ما يحتمل التأجيل وحده (انتهاء الاشتراكات — SPEC القسم 8).
  # توزيع الرحلات ليس هنا: يعيش في عملية التطبيق لأن الراكب ينتظر على الشاشة.
  worker:
    build:
      context: ./backend
    container_name: taxo-worker
    restart: unless-stopped
    env_file:
      # **اسمُ ملفِّ البيئة يُصرَّح ولا يُثبَّت** (2026-08-21): `suite.sh` كان
      # يمرّر `--env-file` وحدَه، **وهذه السطورُ تُثبِّت `.env.local` رغمه** —
      # فيقف compose على استنساخٍ نظيفٍ لا ملفَّ فيه، وهو ما أحمرَّ به CI.
      # **وتصريحٌ نصفُه ليس تصريحاً**: ما لم يحكم الاسمُ الموضعين معاً بقي
      # الأولُ يَعِد بما ينقضه الثاني.
      - ${TAXO_ENV_FILE:-.env.local}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-taxo}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD مطلوبٌ في .env — لا احتياطَ لسرّ}@db:5432/${POSTGRES_DB:-taxo}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.tasks.celery_app:celery_app worker --loglevel=info
    # فحص الصورة يستعلم منفذ الـ API، وهذه العملية لا تفتح منفذاً. البديل
    # يسأل العاملَ نفسه عبر الوسيط: `ping` يمر بحلقة المهام، فيكشف عاملاً
    # حياً بلا مهام يستقبلها — وهو بالضبط ما لا يكشفه وجودُ العملية.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.tasks.celery_app:celery_app inspect ping -d celery@$$HOSTNAME -t 10 || exit 1",
        ]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 3

  # المجدول — **نسخة واحدة لا غير**: نسختان تُطلقان كل دورة مرتين
  beat:
    build:
      context: ./backend
    container_name: taxo-beat
    restart: unless-stopped
    env_file:
      # **اسمُ ملفِّ البيئة يُصرَّح ولا يُثبَّت** (2026-08-21): `suite.sh` كان
      # يمرّر `--env-file` وحدَه، **وهذه السطورُ تُثبِّت `.env.local` رغمه** —
      # فيقف compose على استنساخٍ نظيفٍ لا ملفَّ فيه، وهو ما أحمرَّ به CI.
      # **وتصريحٌ نصفُه ليس تصريحاً**: ما لم يحكم الاسمُ الموضعين معاً بقي
      # الأولُ يَعِد بما ينقضه الثاني.
      - ${TAXO_ENV_FILE:-.env.local}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-taxo}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD مطلوبٌ في .env — لا احتياطَ لسرّ}@db:5432/${POSTGRES_DB:-taxo}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    # ملف الجدول في /tmp: المجلد مربوط بالمصدر ولا يُكتب فيه أثرُ تشغيل
    command: >
      celery -A app.tasks.celery_app:celery_app beat --loglevel=info
      --schedule=/tmp/celerybeat-schedule
    # المجدول لا يستقبل مهاماً فلا يجيب `inspect ping`؛ والدليل على حياته أنه
    # يكتب ملف جدوله. الفحص يقارن زمن تعديله بالآن: مجدولٌ متوقف يتجمّد ملفه
    # بينما تبقى عمليته قائمة — وذاك العطل الذي يهم.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os,time,sys; p='/tmp/celerybeat-schedule'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < 600 else 1)\"",
        ]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3

  # تطبيق الراكب (المرحلة 9) — خادم تطوير Vite. ليس في `depends_on` لأحد:
  # واجهةٌ تعمل والخلفيةُ متوقفة تعرض خطأً يُقرأ، وهو أفضل من حاويةٍ لا تقلع.
  # **المنفذ 5173 مسموحٌ في `cors_origins`**، وهو نفسه ما يبنى عليه
  # `card_return_url` — فتبديله يقطع العودة من صفحة الدفع.
  #
  # ومنفذُ **المضيف** وحده قابلٌ للتبديل بـ`CUSTOMER_APP_PORT` حين يشغله شيءٌ
  # آخر على جهاز المطوّر (وهو ما وقع: مكدَّسٌ آخر باسم `taxo-web` يحجز 5173).
  # الافتراضُ 5173 فلا يتغيّر شيءٌ لمن لا يحتاجه، و**5176 هو البديل الموثَّق**
  # المسموح في `cors_origins` — أيُّ رقمٍ سواه يُردّ بخطأ CORS. وتظل عودةُ
  # صفحة الدفع تحتاج المنفذ الأصلي، فاختبارُ البطاقة يكون عليه وحده.
  customer-app:
    image: node:22-alpine
    container_name: taxo-customer-app
    restart: unless-stopped
    working_dir: /app
    environment:
      # المتصفح يخاطب الخلفية من جهاز المطوّر لا من داخل الشبكة، فالعنوان
      # `localhost:8001` لا `backend:8000`
      # **عنوانٌ يصلح لهاتفٍ لا لهذا الحاسوب وحدَه** (قرارُ المالك 2026-09-12).
      #
      # **العلّةُ مقيسةٌ ثلاثَ مرّات**: النفقُ بُني لتجريب الحزم على هاتفٍ
      # حقيقيّ، **وقائمةُ CORS عرفت نطاقاته 2026-09-09** — **وهذا السطرُ لم
      # يُصلَح قطّ**. فالحزمةُ تُحمَّل شاشاتُها من `dev-*.tajora.ly` ثمّ تنادي
      # `127.0.0.1:8001` — **وهو الهاتفُ نفسُه** — فيردّ كروميوم
      # `ERR_NETWORK_UNREACHABLE`، ويعرض التطبيقُ «تعذّر الوصول إلى الخدمة».
      #
      # **وهو نصفُ بابٍ منذ بُني**: بابٌ مبنيٌّ ومنفذُه مغلق. **و`check:served`
      # لا يمسكه**: يسأل «أالمخدومُ هو المبنيّ؟» **ولا يسأل: أيصلح هذا
      # العنوانُ لجهازٍ غير هذا الحاسوب؟**
      #
      # **والمُبدَّلُ يُترك بابَه**: من يطوّر بلا نفقٍ يضبط
      # `TAXO_DEV_API_BASE=http://127.0.0.1:8001` ويمضي — **ولا يُحرَّر الملفّ
      # فيركب إيداعاً لا شأنَ له به.**
      VITE_API_BASE_URL: ${TAXO_DEV_API_BASE:-https://dev-api.tajora.ly}
    volumes:
      - ./customer-app:/app
      # مجلد الاعتماديات في حجمٍ باسمه: `node_modules` المبنيّ على Windows
      # لا يعمل داخل alpine، وبغير هذا الحجم يحجب المجلدُ المضيفُ ما ثبّتته
      # الحاوية
      - taxo_customer_modules:/app/node_modules
    # **نسخةُ npm مثبَّتةٌ على نسخة المضيف** — العلّةُ والحجّةُ كاملتان عند
    # `driver-app` أعلاه: الصورةُ تحمل npm 10.9.8 والمضيفُ 11.6.2، وهما
    # يكتبان `package-lock.json` كتابتين مختلفتين. **وشجرةٌ تهدأ من بابٍ
    # وتضجّ من بابين ليست هادئة** (قرارُ المالك 2026-08-25).
    command: sh -c "npm i -g npm@11.6.2 && npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "${CUSTOMER_APP_PORT:-5173}:5173"

  # تطبيق الكبتن (المرحلة 10) — نفس ترتيب تطبيق الراكب حرفاً بحرف.
  # **المنفذ 5174 مسموحٌ في `cors_origins`** و5173 محجوزٌ للراكب، فتبديل
  # أيّهما يقطع كل نداء من صاحبه.
  driver-app:
    image: node:22-alpine
    container_name: taxo-driver-app
    restart: unless-stopped
    working_dir: /app
    environment:
      # **عنوانٌ يصلح لهاتفٍ لا لهذا الحاسوب وحدَه** (قرارُ المالك 2026-09-12).
      #
      # **العلّةُ مقيسةٌ ثلاثَ مرّات**: النفقُ بُني لتجريب الحزم على هاتفٍ
      # حقيقيّ، **وقائمةُ CORS عرفت نطاقاته 2026-09-09** — **وهذا السطرُ لم
      # يُصلَح قطّ**. فالحزمةُ تُحمَّل شاشاتُها من `dev-*.tajora.ly` ثمّ تنادي
      # `127.0.0.1:8001` — **وهو الهاتفُ نفسُه** — فيردّ كروميوم
      # `ERR_NETWORK_UNREACHABLE`، ويعرض التطبيقُ «تعذّر الوصول إلى الخدمة».
      #
      # **وهو نصفُ بابٍ منذ بُني**: بابٌ مبنيٌّ ومنفذُه مغلق. **و`check:served`
      # لا يمسكه**: يسأل «أالمخدومُ هو المبنيّ؟» **ولا يسأل: أيصلح هذا
      # العنوانُ لجهازٍ غير هذا الحاسوب؟**
      #
      # **والمُبدَّلُ يُترك بابَه**: من يطوّر بلا نفقٍ يضبط
      # `TAXO_DEV_API_BASE=http://127.0.0.1:8001` ويمضي — **ولا يُحرَّر الملفّ
      # فيركب إيداعاً لا شأنَ له به.**
      VITE_API_BASE_URL: ${TAXO_DEV_API_BASE:-https://dev-api.tajora.ly}
    volumes:
      - ./driver-app:/app
      # `node_modules` المبنيّ على Windows لا يعمل داخل alpine
      - taxo_driver_modules:/app/node_modules
    # **نسخةُ npm مثبَّتةٌ على نسخة المضيف** (قرارُ المالك 2026-08-25).
    # `node:22-alpine` يحمل npm 10.9.8 والمضيفُ 11.6.2، **وهما يكتبان
    # `package-lock.json` كتابتين مختلفتين** — العاشرةُ تحذف علاماتِ
    # `"peer": true` التي تكتبها الحاديةَ عشرة. فكانت الحاويةُ تعيد كتابةَ
    # القفل عند كلِّ إقلاع، **فلا تهدأ الشجرة** — وشجرةٌ لا تهدأ تبتلعها
    # عادةُ `git add -A`، وقد وقع مقيساً: ركب القفلُ إيداعاً لا شأنَ له به.
    #
    # **والأخطرُ من الضجيج أن الحاويةَ تحلّ التبعياتِ حلاًّ يخالف ما تسجّله
    # الشجرة** — وذاك الشكلُ العاشر يقترب: مبنيٌّ يخالف ما يظنّه القارئ.
    # **والاتفاقُ أرخصُ من مراقبة الاختلاف.**
    #
    # ورقمُ النسخة مكتوبٌ صراحةً لا مشتقٌّ: **فيومَ تتغيّر نسخةُ المضيف يظهر
    # هذا السطرُ في الفرق** ويُسأل عنه، بدل أن يعود الاختلافُ صامتاً.
    command: sh -c "npm i -g npm@11.6.2 && npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5174:5174"

  admin-panel:
    image: node:22-alpine
    container_name: taxo-admin-panel
    restart: unless-stopped
    working_dir: /app
    environment:
      # **عنوانٌ يصلح لهاتفٍ لا لهذا الحاسوب وحدَه** (قرارُ المالك 2026-09-12).
      #
      # **العلّةُ مقيسةٌ ثلاثَ مرّات**: النفقُ بُني لتجريب الحزم على هاتفٍ
      # حقيقيّ، **وقائمةُ CORS عرفت نطاقاته 2026-09-09** — **وهذا السطرُ لم
      # يُصلَح قطّ**. فالحزمةُ تُحمَّل شاشاتُها من `dev-*.tajora.ly` ثمّ تنادي
      # `127.0.0.1:8001` — **وهو الهاتفُ نفسُه** — فيردّ كروميوم
      # `ERR_NETWORK_UNREACHABLE`، ويعرض التطبيقُ «تعذّر الوصول إلى الخدمة».
      #
      # **وهو نصفُ بابٍ منذ بُني**: بابٌ مبنيٌّ ومنفذُه مغلق. **و`check:served`
      # لا يمسكه**: يسأل «أالمخدومُ هو المبنيّ؟» **ولا يسأل: أيصلح هذا
      # العنوانُ لجهازٍ غير هذا الحاسوب؟**
      #
      # **والمُبدَّلُ يُترك بابَه**: من يطوّر بلا نفقٍ يضبط
      # `TAXO_DEV_API_BASE=http://127.0.0.1:8001` ويمضي — **ولا يُحرَّر الملفّ
      # فيركب إيداعاً لا شأنَ له به.**
      VITE_API_BASE_URL: ${TAXO_DEV_API_BASE:-https://dev-api.tajora.ly}
    volumes:
      - ./admin-panel:/app
      # `node_modules` المبنيّ على Windows لا يعمل داخل alpine
      - taxo_admin_modules:/app/node_modules
    # **نسخةُ npm مثبَّتةٌ على نسخة المضيف** — العلّةُ والحجّةُ كاملتان عند
    # `driver-app` أعلاه: الصورةُ تحمل npm 10.9.8 والمضيفُ 11.6.2، وهما
    # يكتبان `package-lock.json` كتابتين مختلفتين. **وشجرةٌ تهدأ من بابٍ
    # وتضجّ من بابين ليست هادئة** (قرارُ المالك 2026-08-25).
    command: sh -c "npm i -g npm@11.6.2 && npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5175:5175"

volumes:
  taxo_wa_auth:
  taxo_pgdata:
  taxo_redisdata:
  taxo_customer_modules:
  taxo_driver_modules:
  taxo_admin_modules:
  taxo_documents:
