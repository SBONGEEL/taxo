# نسخةُ الحاوية من `config.yml` — **والفرقُ سطرُ العنوان وحدَه**.
#
# داخل الحاوية `localhost` هي الحاويةُ نفسُها لا الجهاز، فالخدماتُ تُخاطَب عبر
# `host.docker.internal` (يوفّرها Docker Desktop على ويندوز وماك).
#
# **وأيُّهما تستعمل؟** الأصلُ (`config.yml`) مع `cloudflared` مثبَّتاً على
# ويندوز مباشرةً — وهو الأبسط والأقلُّ مفاجآت. وهذه مع
# `docker compose -f docker-compose.yml -f docker-compose.tunnel.yml`.
# ولا تُشغَّل الاثنتان معاً: نفقان بالاسم نفسِه يتقاسمان الطلبات فتُقرأ
# النتيجةُ «يعمل أحياناً».

# **بالمُعرِّف لا بالاسم** (2026-08-14): النفقُ المسمّى يحتاج `cert.pem` كي يسأل
# واجهةَ Cloudflare عن مُعرِّفه، والمُعرِّفُ الصريح مع ملفِّ الاعتماد يُغني عنها.
tunnel: e0ef1dd8-3d62-4af9-81d0-514056d41dc7
# **و`/creds` لا `/root`**: صورةُ `cloudflared:latest` صارت تعمل بمستخدم 65532 لا
# `root` (قِيس: `Config.User=65532:65532`)، و`/root` لا يُدخل إليه غيرُ صاحبه —
# فاعتمادٌ مركَّبٌ هناك موجودٌ ولا يُرى. وهذا ما كسر النفقَ بعد أن كان يعمل:
# وسمُ `latest` تحرّك تحت المشروع، لا تغييرٌ في إعداده.
credentials-file: /creds/e0ef1dd8-3d62-4af9-81d0-514056d41dc7.json

ingress:
  - hostname: api.tajora.ly
    service: http://host.docker.internal:8001

  # ٥١٧٦ لا ٥١٧٣ على هذا الجهاز (`CUSTOMER_APP_PORT` في `.env.local`)
  - hostname: app.tajora.ly
    service: http://host.docker.internal:5176

  - hostname: driver.tajora.ly
    service: http://host.docker.internal:5174

  - hostname: admin.tajora.ly
    service: http://host.docker.internal:5175

  - service: http_status:404
