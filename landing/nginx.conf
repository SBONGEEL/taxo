# **رؤوسُ التخزين — والعلّةُ مقيسةٌ لا احتياط** (2026-08-21).
#
# نُشرت الصفحةُ بالرقم الجديد، **وظلّت Cloudflare تخدم القديم**: `cf-cache-status:
# HIT` و`Age: 1086` تحت `max-age=14400`. فالأصلُ صحيحٌ تماماً والناسُ يقرأون
# نسخةً عمرُها أربعُ ساعات.
#
# **وهو الشكلُ العاشر بعمودٍ خامس**: المبنيُّ · الحاويةُ · النفقُ · ما يُحمَّل ·
# **وما تخدمه الحافةُ**. وأخطرُ من سابقيه لأنه يقع **بعد** أن يصير كلُّ شيءٍ
# صحيحاً عندنا.
#
# **والعلاجُ عند الأصل لا بالتنظيف اليدويّ**: مسحُ الذاكرة بعد كل نشرةٍ خطوةٌ
# تُنسى، والرأسُ قاعدةٌ تُطبَّق.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # **الصفحةُ وإعدادُها ومنطقُها وبيانُها: لا تُخزَّن**. صغيرةٌ كلُّها، والفرقُ
    # بين نشرةٍ وأخرى يجب أن يصل **الآن** — ورقمُ دعمٍ قديمٌ يعني مكالمةً تذهب
    # إلى لا أحد.
    location ~* \.(html|js|json)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires -1;
    }

    # **والحزمةُ كذلك، وهذا هو المهمّ**: اسمُ الملفِّ ثابتٌ ومحتواه يتغيّر مع كل
    # بناء — فحافةٌ تخزّنه تعطي إنساناً بناءً قديماً **يبقى في هاتفه شهوراً**.
    # وهو بالضبط ما يحرسه `tools/check-apk.mjs` من الخارج؛ وهذا يمنعه من الداخل.
    location ~* \.apk$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Content-Type "application/vnd.android.package-archive" always;
        expires -1;
    }

    # **الأبوابُ العامّةُ من الأصل نفسِه — لا نداءَ عابرَ أصل** (§52).
    #
    # **والعلّةُ مقيسةٌ لا احتياط**: `landing/app.js` كان ينادي
    # `https://stg-api.tajora.ly/api/v1/public/landing` من `taxo.tajora.ly`،
    # **وذاك أصلٌ آخر و`cors_origins` لا يحمل اسمَ الصفحة** — فالمتصفّحُ يمنع
    # قراءةَ الجواب، والنداءُ يفشل صامتاً (`catch` يبتلعه). **فسطرُ العرض لم
    # يظهر قطُّ على الإنتاج، ولا شيءَ كان يقول ذلك.**
    #
    # **والعلاجُ أصلٌ واحدٌ لا قائمةٌ أوسع**: توسيعُ `cors_origins` يفتح سطحاً
    # أمنيّاً ليحلّ مشكلةَ عنوان، **والوكالةُ تجعل النداءَ داخليّاً فلا CORS
    # أصلاً**. وهي أضيقُ الحلّين.
    #
    # **ولا يُخدَم من هنا إلا ما هو عامٌّ بحكم بنائه**: `/public/` وحدَه —
    # وبابٌ إداريٌّ لا يصله زائرٌ من هذه الوكالة.
    location /api/ {
        proxy_pass http://backend:8000/api/v1/public/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # **المسارات: ملفّاتٌ حقيقيةٌ لا إعادةُ كتابةٍ إلى صفحةٍ واحدة**.
    # `/privacy` و`/terms` صفحتان مبنيّتان، **فتُقرآن بلا JavaScript**
    # ويفهرسهما محرّكُ البحث كصفحتين لا كواحدة.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
