# **رؤوسُ التخزين — والعلّةُ مقيسةٌ لا احتياط** (2026-08-21).
#
# نُشرت الصفحةُ بالرقم الجديد، **وظلّت Cloudflare تخدم القديم**: `cf-cache-status:
# HIT` و`Age: 1086` تحت `max-age=14400`. فالأصلُ صحيحٌ تماماً والناسُ يقرأون
# نسخةً عمرُها أربعُ ساعات.
#
# **وهو الشكلُ العاشر بعمودٍ خامس**: المبنيُّ · الحاويةُ · النفقُ · ما يُحمَّل ·
# **وما تخدمه الحافةُ**. وأخطرُ من سابقيه لأنه يقع **بعد** أن يصير كلُّ شيءٍ
# صحيحاً عندنا.
#
# **والعلاجُ عند الأصل لا بالتنظيف اليدويّ**: مسحُ الذاكرة بعد كل نشرةٍ خطوةٌ
# تُنسى، والرأسُ قاعدةٌ تُطبَّق.

# ══ HTTPS وحدَه — **يُحوَّل عند الأصل لا من إعدادات Cloudflare** (SPEC §٦٨-ج/٧) ══
#
# **قِيس ٢٠٢٦-١٠-٠٩** (SPEC §٦٨-ب/٤): `http://taxo.tajora.ly` يجيب ٢٠٠ ولا يحوّل — **وصفحةُ
# تحميلٍ تُخدَم بلا تشفيرٍ يمكن أن يُبدَّل ملفُّها في الطريق**، والبصمةُ
# المعروضةُ بجانبه تُبدَّل معه.
#
# **والأصلُ لا يرى المخطَّط**: النفقُ يصله بـHTTP دائماً (`http://landing:80`)،
# **فـ`$scheme` هنا `http` لكلِّ زائر** — وتحويلٌ عليه حلقةٌ لا تنتهي. فيُقرأ ما
# كتبته الحافّةُ عن الزائر:
#   · `CF-Visitor` (`{"scheme":"https"}`) **أوّلاً** — تكتبه Cloudflare وحدَها؛
#   · و`X-Forwarded-Proto` **حين يغيب الأوّل وحدَه**.
# **وغيابُهما معاً لا يحوّل**: فحصُ الصحّة في compose (`wget http://127.0.0.1/`)
# يصل بلا ترويسة، **وتحويلُه يُسقط الحاويةَ في «غير سليمة»**.
#
# **و`map` في سياق `http`** — هذا الملفُّ يُضمَّن داخله (`conf.d/default.conf`).
map $http_cf_visitor $taxo_visitor_scheme {
    default                          "";
    '~*"scheme"\s*:\s*"https"'       https;
    '~*"scheme"\s*:\s*"http"'        http;
}

# **المفتاحُ «مخطَّطُ الحافّة:الترويسة»** — فـ`https:http` لا يحوّل (الحافّةُ
# قالت https، وتُقدَّم)، و`:http` يحوّل (لا حافّةَ، والترويسةُ قالت http)،
# و`:` لا يحوّل (فحصُ الصحّة).
map "$taxo_visitor_scheme:$http_x_forwarded_proto" $taxo_to_https {
    default     0;
    "~^http:"   1;
    "~^:http$"  1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # **العنوانُ الرسميُّ مكتوبٌ لا مأخوذٌ من `Host`**: الطلبُ يكتب `Host` بيده،
    # **وتحويلٌ يبنيه منه يحوّل إلى حيث يشاء الطالب**.
    if ($taxo_to_https) {
        return 301 https://taxo.tajora.ly$request_uri;
    }

    # **HSTS — سنةٌ، بلا `includeSubDomains` ولا `preload`** (SPEC §٦٨-ج/٧):
    # النطاقاتُ الأخرى تحت `tajora.ly` ليست هنا، **وإلزامُها من صفحةٍ واحدةٍ
    # قرارٌ لا يُتّخذ في ملفّ إعداد**؛ و`preload` قائمةٌ في المتصفّحات لا يُخرج
    # منها بسطر.
    #
    # **⚠ و`add_header` لا يُورَث إلى موضعٍ يكتب `add_header` لنفسه** (قاعدةُ
    # نجينكس): كلُّ `location` تحته يضع رأسَ تخزينٍ يعيد كتابتَه، **وإلا خرج
    # بلا HSTS صامتاً**. والمتصفّحُ يتجاهله على HTTP، فلا ضررَ في رأس التحويل.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # **الصفحةُ وإعدادُها ومنطقُها وبيانُها: لا تُخزَّن**. صغيرةٌ كلُّها، والفرقُ
    # بين نشرةٍ وأخرى يجب أن يصل **الآن** — ورقمُ دعمٍ قديمٌ يعني مكالمةً تذهب
    # إلى لا أحد.
    #
    # **وبلا `expires -1`** (٢٠٢٦-١٠-٠٩): كان يكتب `Cache-Control: no-cache`
    # **ثانيةً** فوق `add_header` ومعها `Expires` — ترويستا `Cache-Control`
    # لقاعدةٍ واحدة، وأيُّهما يُقرأ يختاره العميلُ والحافّة. **فالقاعدةُ تُكتب
    # مرّةً**، و`no-cache` يكفي ولا يحتاج `Expires`.
    location ~* \.(html|js|json)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # **والحزمةُ كذلك، وهذا هو المهمّ**: اسمُ الملفِّ ثابتٌ ومحتواه يتغيّر مع كل
    # بناء — فحافةٌ تخزّنه تعطي إنساناً بناءً قديماً **يبقى في هاتفه شهوراً**.
    # وهو بالضبط ما يحرسه `tools/check-apk.mjs` من الخارج؛ وهذا يمنعه من الداخل.
    # **وصفحةُ التحميل تضيف `?v=<البصمة>`** إلى الرابط فلا يعيد متصفّحٌ ملفّاً
    # سابقاً — والموضعُ يطابق المسارَ بلا الاستعلام، فالقاعدةُ تبقى كما هي.
    #
    # **والنوعُ من `types` لا من `add_header`** (٢٠٢٦-١٠-٠٩): نجينكس يرسل
    # `Content-Type` من جدوله دائماً (و`default_type` لما لا يسمّيه)، **و`add_header
    # Content-Type` لا يستبدله بل يضيف ترويسةً ثانية** — نوعان لملفٍّ واحد،
    # وأيُّهما يُقرأ يختاره العميل. **و`types` داخل الموضع يستبدل الجدولَ له
    # وحدَه**، فترويسةٌ واحدة. **ولم يُقَس بعد**: `curl -sI` على الحزمة بعد
    # الرفع يُظهر سطراً واحداً.
    location ~* \.apk$ {
        types { application/vnd.android.package-archive apk; }
        default_type application/vnd.android.package-archive;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # **الأبوابُ العامّةُ من الأصل نفسِه — لا نداءَ عابرَ أصل** (§52).
    #
    # **والعلّةُ مقيسةٌ لا احتياط**: `landing/app.js` كان ينادي
    # `https://stg-api.tajora.ly/api/v1/public/landing` من `taxo.tajora.ly`،
    # **وذاك أصلٌ آخر و`cors_origins` لا يحمل اسمَ الصفحة** — فالمتصفّحُ يمنع
    # قراءةَ الجواب، والنداءُ يفشل صامتاً (`catch` يبتلعه). **فسطرُ العرض لم
    # يظهر قطُّ على الإنتاج، ولا شيءَ كان يقول ذلك.**
    #
    # **والعلاجُ أصلٌ واحدٌ لا قائمةٌ أوسع**: توسيعُ `cors_origins` يفتح سطحاً
    # أمنيّاً ليحلّ مشكلةَ عنوان، **والوكالةُ تجعل النداءَ داخليّاً فلا CORS
    # أصلاً**. وهي أضيقُ الحلّين.
    #
    # **ولا يُخدَم من هنا إلا ما هو عامٌّ بحكم بنائه**: `/public/` وحدَه —
    # وبابٌ إداريٌّ لا يصله زائرٌ من هذه الوكالة.
    location /api/ {
        proxy_pass http://backend:8000/api/v1/public/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # **المسارات: ملفّاتٌ حقيقيةٌ لا إعادةُ كتابةٍ إلى صفحةٍ واحدة**.
    # `/privacy` و`/terms` صفحتان مبنيّتان، **فتُقرآن بلا JavaScript**
    # ويفهرسهما محرّكُ البحث كصفحتين لا كواحدة.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # **و`$uri.html` هو ما يصل بين المسار والملفّ** (قِيس على الإنتاج
    # ٢٠٢٦-٠٩-٠٥): كان `try_files $uri $uri/ =404` وحدَه، **فطلبُ `/privacy`
    # يجرّب ملفّاً اسمُه `privacy` ثمّ مجلَّداً، ولا يجرّب `privacy.html`
    # أبداً** — فيردّ ٤٠٤ **والملفُّ تحته على القرص بأحدَ عشرَ كيلوبايت**.
    #
    # **والتعليقُ فوقَه كان يصف ما لا يقع**: «صفحتان مبنيّتان تُقرآن بلا
    # JavaScript» — صحيحٌ في البناء، **كاذبٌ في الخدمة**. وهو «توثيقٌ يصف
    # ما ليس كذلك» بعينه، **ولم يكشفه إلا طلبُ العنوان نفسِه**.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # **صفحةُ التحميل — موضعٌ باسمها لا تحت `location /`** (SPEC §٦٨-ج/٦).
    #
    # `/download` بلا امتداد، **فلا يبلغه موضعُ `.html` أعلاه** ويُخدَم من
    # `location /` بلا `Cache-Control` — **فيحفظه المتصفّحُ بتقديره** (عُشرُ
    # عمر الملفّ). **وهي الصفحةُ التي تقول «هذا هو الملفُّ وهذه بصمتُه»**،
    # فتُعاد مصادقتُها في كلِّ فتحٍ كبقية الصفحات.
    #
    # **⚠ وأخواتُها بلا امتداد (`/privacy` · `/terms` · `/delete-account`)
    # تحت `location /` بالحال نفسِه** — مكتوبٌ لا مسكوتٌ عنه، ولم تُمسّ هنا.
    location = /download {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files /download.html =404;
    }

    # **و`/download/` بشَرطةٍ تحوَّل إليها لا ٤٠٤** — رابطٌ يُكتب باليد في رسالةٍ
    # ينتهي بشَرطةٍ كثيراً، **وصفحةُ التحميل آخرُ ما يجوز أن يردّ «غير موجود»**.
    #
    # **و`absolute_redirect off` شرطٌ لا زينة**: نجينكس يكمّل `/download` إلى
    # عنوانٍ تامٍّ من `$scheme` — **وهو `http` هنا لكلِّ زائر** (النفقُ، أعلاه) —
    # فيصير التحويلُ `http://…/download`: **نزولٌ من HTTPS ثمّ قفزةٌ ثانية**.
    # والنسبيُّ يُكمله المتصفّحُ من العنوان الذي هو عليه. والاستعلامُ يُحمل معه.
    location = /download/ {
        absolute_redirect off;
        return 301 /download$is_args$args;
    }

    # **ملفّا الإعداد في جذر الخدمة لا يُخدَمان** (٢٠٢٦-١٠-٠٩): البناءُ يكتب في
    # `landing/` بلا إفراغ (`vite.config.js`)، **فهذا الملفُّ و`spa.conf` جالسان
    # بين الصفحات**، والجذرُ مركَّبٌ كلُّه (`./landing:/usr/share/nginx/html`)
    # و`location /` يجد الملفَّ — **فخريطةُ الوكالة والأبواب تُخدَم لمن طلبها**
    # (بالبناء لا بالقياس: لم يُطلب على الإنتاج). **وموضعٌ مطابقٌ لكلٍّ منهما**:
    # المطابقةُ التامّةُ تسبق كلَّ موضعٍ هنا.
    location = /nginx.conf {
        return 404;
    }
    location = /spa.conf {
        return 404;
    }
}
