# **خادمُ تطبيقٍ أحاديِّ الصفحة** — للحزمتين معاً، ملفٌّ واحدٌ لا اثنان.
#
# **و`try_files … /index.html` شرطٌ لا زينة**: المسارات (`/wallet`،
# `/account/vehicle`) لا تقابلها ملفاتٌ على القرص — فبغيرها يعطي `nginx` **404
# لكلِّ فتحٍ مباشرٍ لرابطٍ داخليّ**، ويعمل التطبيقُ من الجذر وحدَه.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # **`index.html` لا يُخزَّن** — هو الذي يسمّي بصمةَ الحزمة، فتخزينُه يعني
    # حافةً تشير إلى حزمةٍ قديمة (العمودُ الخامس، قِيس 2026-08-21)
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires -1;
    }

    # **و`sw.js` لا يُخزَّن كذلك** — المعاملةُ نفسُها التي لـ`index.html` (قِيس
    # 2026-09-22). **لم تكن له قاعدة**، فوقع تحت `location /` بلا `Cache-Control`،
    # **فطبّقت Cloudflare افتراضَها: `max-age=14400`، أربعُ ساعات**. ورُفع عاملٌ
    # جديدٌ فظلّت الحافّةُ تسلّم القديم — قِيس وقد مضى 5602 ث وبقي نحو 146 دقيقة
    # — **وبوّابةُ «الحافّة» خضراءُ لأنها تفحص صفحاتِ السياسة وحدَها**. واسمُ `sw.js` ثابتٌ لا بصمةَ فيه، **فهو كـ`index.html` لا
    # كـ`/assets`**: ما لا يتغيّر اسمُه يجب ألّا يُخزَّن.
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires -1;
    }

    # **والأصولُ تُخزَّن طويلاً بأمان**: اسمُها يحمل بصمتَها (`index-D-ceH813.js`)،
    # فبناءٌ جديدٌ اسمٌ جديد — ولا تُخدَم نسخةٌ قديمةٌ تحت اسمٍ يطلبه أحد
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
